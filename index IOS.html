<style>
  :root{
    --bg:#0A100C; --surface:#131B16; --surface-2:#1B2620; --surface-3:#233028;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#EAF1EC; --text-dim:#95A69C; --text-faint:#5A6B61;
    --teal:#33C793; --teal-dim:rgba(51,199,147,0.14);
    --brain:#9B87F5; --brain-dim:rgba(155,135,245,0.15);
    --heart:#F2637A; --heart-dim:rgba(242,99,122,0.15);
    --amber:#E3A23C; --amber-dim:rgba(227,162,60,0.15);
    --blue:#5B9FE0; --blue-dim:rgba(91,159,224,0.15);
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;}
  html,body{height:100%; overscroll-behavior:none;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:
      radial-gradient(circle at 12% -8%, rgba(51,199,147,0.16), transparent 42%),
      radial-gradient(circle at 92% 108%, rgba(155,135,245,0.12), transparent 40%),
      radial-gradient(circle at 18% 0%, #101c15 0%, var(--bg) 55%);
    font-family:'Inter',sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:12px;
    overscroll-behavior:none; -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  h1,h2,h3,.num,.brand{font-family:'Space Grotesk',sans-serif;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer; touch-action:manipulation;}
  a,.chip,.navitem,.btn,.back,.toggle,.check{touch-action:manipulation;}
  ::selection{background:var(--teal-dim);}

  /* iOS Safari zooms the whole page when a focused field is under 16px.
     Force 16px on every real input/select (inline font-sizes below are
     bumped to match further down) and normalize their native chrome so
     they stay on-theme instead of falling back to default white iOS controls. */
  input,select,textarea{
    font-size:16px !important; -webkit-appearance:none; appearance:none;
    -webkit-text-fill-color:var(--text); border-radius:8px;
  }
  select{
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2395A69C' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
    background-repeat:no-repeat; background-position:right 10px center; background-size:16px; padding-right:32px !important;
  }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input[type="number"]{-moz-appearance:textfield;}

  /* ---------------- top-level mode switch ---------------- */
  .modebar{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--border-strong);
    border-radius:100px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .modebar button{
    border:none; background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:500;
    padding:8px 16px; border-radius:100px; transition:.15s;
  }
  .modebar button.active{background:var(--teal); color:#04241a;}

  /* ================= APP (phone / dashboard) ================= */
  .app-wrap{display:none; width:100%; height:100%; align-items:center; justify-content:center;}
  .app-wrap.active{display:flex;}

  .phone{
    width:100%; max-width:400px; height:calc(100vh - 24px); height:calc(100dvh - 24px); max-height:840px;
    background:var(--bg); border-radius:30px;
    border:1px solid var(--border-strong); position:relative; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    display:flex; flex-direction:column;
  }
  @media (min-width:480px){ .phone{ border-radius:44px; } }
  .statusbar{
    display:flex; justify-content:space-between; padding:16px 26px 6px;
    font-size:13px; color:var(--text-dim); flex-shrink:0;
  }
  .screens{flex:1; position:relative; overflow:hidden;}
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:8px 20px 0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
    opacity:0; pointer-events:none;
    transform:translateY(10px);
    transition:opacity .22s ease, transform .22s ease;
  }
  .screen.active{opacity:1; transform:translateY(0); pointer-events:auto;}
  .screen::-webkit-scrollbar{display:none;}

  .topbar{display:flex; align-items:center; gap:10px; padding:6px 0 16px; flex-shrink:0;}
  .topbar h2{font-size:17px; font-weight:600; margin:0; flex:1; padding-right:30px;}
  .back{width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:14px; flex-shrink:0; transition:transform .12s ease;}
  .back:active{transform:scale(.88);}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .btn{
    border-radius:14px; border:1px solid var(--border-strong); background:var(--surface-2);
    color:var(--text); padding:14px 20px; font-size:14px; font-weight:600; text-align:center;
    transition:transform .12s ease, box-shadow .15s ease, opacity .15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn:active{transform:scale(.96); opacity:0.9;}
  .btn .bicon{width:16px; height:16px; flex-shrink:0;}
  .btn.primary{background:linear-gradient(135deg, var(--teal), #1a9c74); color:#04241a; border-color:transparent; box-shadow:0 8px 22px rgba(51,199,147,.3);}
  .btn.primary:active{box-shadow:0 4px 12px rgba(51,199,147,.24);}
  .btn.danger{background:linear-gradient(135deg, var(--heart), #d24862); color:#2a0a10; border-color:transparent; box-shadow:0 8px 22px rgba(242,99,122,.28);}
  .btn.ghost{background:transparent; border-color:var(--border);}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:0.35; pointer-events:none;}
  .btn-row{display:flex; gap:10px; margin-top:auto; padding:16px 0 22px;}

  .label{font-size:11.5px; color:var(--text-faint); letter-spacing:.01em;}
  .muted{color:var(--text-dim); font-size:13px; line-height:1.5;}

  .pill{font-size:11px; padding:3px 10px; border-radius:20px; font-weight:500; display:inline-block;}
  .pill.teal{background:var(--teal-dim); color:var(--teal);}
  .pill.amber{background:var(--amber-dim); color:var(--amber);}
  .pill.heart{background:var(--heart-dim); color:var(--heart);}
  .pill.brain{background:var(--brain-dim); color:var(--brain);}
  .pill.blue{background:var(--blue-dim); color:var(--blue);}

  .chip{border:1px solid var(--border-strong); border-radius:12px; padding:10px 12px; font-size:13px; text-align:center; background:var(--surface-2); color:var(--text-dim); transition:transform .1s ease, background .15s ease, border-color .15s ease, color .15s ease;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--teal-dim); border-color:var(--teal); color:var(--teal); box-shadow:0 0 0 1px var(--teal) inset;}
  .chip-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  .toggle{width:42px; height:24px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border-strong); position:relative; flex-shrink:0; transition:background .15s ease, border-color .15s ease;}
  .toggle .knob{width:18px; height:18px; border-radius:50%; background:var(--text-faint); position:absolute; top:2px; left:2px; transition:.18s cubic-bezier(.34,1.56,.64,1);}
  .toggle.on{background:var(--teal-dim); border-color:var(--teal);}
  .toggle.on .knob{left:21px; background:var(--teal);}

  .row-line{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border);}
  .row-line:last-child{border-bottom:none;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dot.teal{background:var(--teal);} .dot.amber{background:var(--amber);} .dot.heart{background:var(--heart);} .dot.brain{background:var(--brain);}

  /* --- stage banner (pulse speed communicates urgency) --- */
  .stage-banner{border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px;}
  .stage-banner.warmup{background:var(--surface-2); border:1px solid var(--border-strong);}
  .stage-banner.optimal{background:var(--teal-dim); border:1px solid transparent;}
  .stage-banner.effort{background:var(--amber-dim); border:1px solid transparent;}
  .stage-banner.risk{background:var(--heart-dim); border:1px solid transparent;}
  .stage-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .stage-banner.warmup .stage-dot{background:var(--text-dim);}
  .stage-banner.optimal .stage-dot{background:var(--teal); animation:pulseTeal 2.2s ease-out infinite;}
  .stage-banner.effort .stage-dot{background:var(--amber); animation:pulseAmber 1.5s ease-out infinite;}
  .stage-banner.risk .stage-dot{background:var(--heart); animation:pulseHeart 0.9s ease-out infinite;}
  @keyframes pulseTeal{0%{box-shadow:0 0 0 0 rgba(51,199,147,.5);}70%{box-shadow:0 0 0 10px rgba(51,199,147,0);}100%{box-shadow:0 0 0 0 rgba(51,199,147,0);}}
  @keyframes pulseAmber{0%{box-shadow:0 0 0 0 rgba(227,162,60,.5);}70%{box-shadow:0 0 0 10px rgba(227,162,60,0);}100%{box-shadow:0 0 0 0 rgba(227,162,60,0);}}
  @keyframes pulseHeart{0%{box-shadow:0 0 0 0 rgba(242,99,122,.55);}60%{box-shadow:0 0 0 12px rgba(242,99,122,0);}100%{box-shadow:0 0 0 0 rgba(242,99,122,0);}}
  .stage-banner .stage-title{font-weight:600; font-size:14px;}
  .stage-banner .stage-sub{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

/* Flattened, searchable version of every dish across every cuisine — used by the food scanner. */
const FOOD_DATABASE = [];
FOOD_CUISINES.forEach(c=>{
  FOOD_DISHES[c.id].forEach(dish=>{
    FOOD_DATABASE.push(Object.assign({cuisineId:c.id, cuisineName:c.name, cuisineEmoji:c.emoji}, dish));
  });
});
function searchFoodDatabase(query){
  const q = (query||'').trim().toLowerCase();
  if(!q) return FOOD_DATABASE;
  return FOOD_DATABASE.filter(f=>f.name.toLowerCase().includes(q) || f.cuisineName.toLowerCase().includes(q));
}

function mealTargets(activity){
  return {
    proteinG: Math.round(state.bodyProfile.weight * PROTEIN_G_PER_KG[activity]),
    carbG: Math.round(state.bodyProfile.weight * CARB_G_PER_KG[activity]),
  };
}
function computeDishPortion(dish, targets, tdee){
  let grams;
  if(dish.per100.carb > 2){
    grams = (targets.carbG / dish.per100.carb) * 100;
  } else {
    grams = (targets.proteinG / (dish.per100.protein || 1)) * 100;
  }
  const calorieCeilingGrams = ((tdee*0.35) / dish.per100.kcal) * 100;
  grams = Math.min(grams, calorieCeilingGrams);
  grams = Math.max(60, Math.min(500, Math.round(grams/10)*10));
  const scale = grams / dish.serving.grams;
  return {
    grams, scale,
    kcal: Math.round(dish.per100.kcal*grams/100),
    protein: Math.round(dish.per100.protein*grams/100),
    carb: Math.round(dish.per100.carb*grams/100),
    fat: Math.round(dish.per100.fat*grams/100),
  };
}
function fitLabel(scale){
  if(scale<0.6) return {text:'Smaller portion', cls:'amber'};
  if(scale<=1.3) return {text:'Good fit', cls:'teal'};
  return {text:'Generous — fine occasionally', cls:'blue'};
}

function computeBMR(p){ const sexOffset = p.sex==='male' ? 5 : -161; return 10*p.weight + 6.25*p.height - 5*p.age + sexOffset; }
function computeTDEE(p){ return Math.round(computeBMR(p) * (ACTIVITY_MULT[p.activityLevel]||1.55)); }
function computeCalorieBurn(activity, minutes, avgHeart){
  const met = (MET_BY_ACTIVITY[activity]||5) * (0.8 + (avgHeart/100)*0.4);
  return Math.round(met * 3.5 * state.bodyProfile.weight / 200 * minutes);
}
function sorenessCount(level){ return Object.values(state.soreness).filter(v=>v===level).length; }
function computeRecoveryScore(lastSession){
  let score = 100;
  if(lastSession){
    score -= lastSession.avgHeart*0.25;
    score -= lastSession.avgBrain*0.15;
    score -= (lastSession.avgCortisol||0)*0.2;
  }
  score -= sorenessCount('sore')*7;
  score -= sorenessCount('mild')*3;
  if(state.sleepHours>=8) score += 8;
  else if(state.sleepHours<6) score -= 15;
  return Math.max(5, Math.min(100, Math.round(score)));
}
function recoveryTier(score){
  if(score>=75) return {label:'Ready', cls:'teal', note:'Signals point to a well-recovered body and mind — a harder session is reasonable today.'};
  if(score>=45) return {label:'Caution', cls:'amber', note:'Partial recovery — a light-to-moderate session is fine, but hold off on a personal best.'};
  return {label:'Recover', cls:'heart', note:'Signals point to real fatigue — prioritize rest, sleep, and food over training today.'};
}
function recommendedSleep(lastSession){
  let base = 7.5;
  if(lastSession){
    if(lastSession.activity==='hiit' || lastSession.activity==='bodybuilding') base += 0.75;
    if(lastSession.avgHeart>70) base += 0.5;
    if((lastSession.avgCortisol||0)>=70) base += 0.5;
    if(lastSession.risk) base += 0.5;
  }
  return {low: Math.round((base-0.5)*10)/10, high: Math.round((base+0.5)*10)/10};
}

    {id:'fartlek', name:'Fartlek run', tag:'Unstructured speed play',
     brainRole:'Constant on-the-fly pacing decisions (sprint to that tree, ease to that corner) keep the brain more actively engaged than a fixed-pace run.',
     heartRole:'Heart strain swings up and down freely rather than following a fixed structure — a naturally varied cardiac workout.',
     problem:{title:'Hard efforts blur together with no real recovery', why:'The "easy" portions between surges aren\'t actually easy, so heart strain never gets the down-swing that makes fartlek effective.'},
     solution:['Make the easy segments deliberately easy — jog, don\'t cruise at moderate pace','Use landmarks or time, not feel alone, to mark the surges','Cut the session short if easy segments stop feeling like real recovery']},
    {id:'trail-run', name:'Trail run', tag:'Uneven-terrain endurance',
     brainRole:'Constant terrain-reading and foot-placement decisions make this more brain-demanding per mile than road running.',
     heartRole:'Heart strain spikes on climbs and technical sections even at a pace that would feel easy on flat road.',
     problem:{title:'Heart rate feels high for what seems like an easy effort', why:'Terrain, not fitness, is driving the extra strain — climbs and uneven footing cost more than the pace alone suggests.'},
     solution:['Judge trail effort by heart level and feel, not by your road pace','Hike the steepest climbs rather than forcing a run','Expect a trail "easy day" to cost more than a road easy day, and plan recovery accordingly']},
    {id:'marathon-pace', name:'Marathon-pace run', tag:'Race-pace practice',
     brainRole:'Holding a precise, sustainable pace for a long time is a rehearsal for race-day pacing discipline as much as a fitness session.',
     heartRole:'Heart strain should stay remarkably stable for the whole effort — real marathon fitness shows up as a flat line here, not a rising one.',
     problem:{title:'Heart rate keeps climbing at a supposedly "steady" pace', why:'The chosen pace is faster than current marathon fitness supports — a classic sign the goal pace needs revising.'},
     solution:['Back off the pace by 10–15s/km and see if heart strain flattens out','Practice this session more often at an honest, sustainable pace before chasing the goal pace','Reassess goal pace using a recent race or time-trial rather than an aspirational number']},
    {id:'track-repeats', name:'Track repeats (e.g. 400m/800m)', tag:'Precision speed work',
     brainRole:'Hitting exact target splits repeatedly demands continuous pacing focus — this is where runners practice pace judgment under fatigue.',
     heartRole:'Heart strain rises rep to rep and should partially recover in the rest interval — full recovery isn\'t the goal here the way it is in hill sprints.',
     problem:{title:'Splits fall apart in the back half of the set', why:'Pace was set slightly too aggressive for current fitness, so heart strain accumulates faster than recovery jogs can clear it.'},
     solution:['Start the set 1–2s/rep slower than goal pace and see if it holds better','Extend the recovery jog slightly rather than shortening the rep','Cut the number of reps rather than let splits drift wildly off target']},
  ],
  swimming:[
    {id:'freestyle', name:'Freestyle (front crawl)', tag:'Technique + endurance',
     brainRole:'Coordinating breathing rhythm, arm rotation, and kick timing simultaneously is one of the highest technical-coordination demands in this whole app.',
     heartRole:'Horizontal position and water pressure naturally keep heart rate lower than the equivalent effort on land, so perceived effort is a better guide than raw heart-rate numbers.',
     problem:{title:'Breathless despite a pace that "should" feel manageable', why:'Breathing rhythm is likely mistimed with the stroke — breathing on a fixed side every stroke, rather than a rhythm that matches effort, causes this.'},
     solution:['Practice bilateral breathing (both sides) at easy pace to find a natural rhythm','Slow the stroke rate slightly rather than rushing the breath','Do short, technique-focused reps before chasing distance or speed']},
    {id:'backstroke', name:'Backstroke', tag:'Technique + shoulder mobility',
     brainRole:'Swimming without seeing where you\'re going relies heavily on brain-driven spatial awareness (counting strokes, feeling the wall) rather than vision.',
     heartRole:'Similar cardiovascular demand to freestyle, but face-up positioning makes breathing rhythm naturally easier to sustain.',
     problem:{title:'Veering off-line across the pool', why:'Core and hip stability is fatiguing, letting the body rotate too much side to side instead of tracking straight.'},
     solution:['Engage the core to reduce excess hip rotation','Count strokes from the flags to judge wall distance instead of looking back','Shorten reps if drifting off-line becomes frequent — it\'s a fatigue signal, not just a technique quirk']},
    {id:'breaststroke', name:'Breaststroke', tag:'Technique + timing',
     brainRole:'The glide-pull-kick-breathe sequence has a very specific timing window — brain-driven timing errors here cost far more speed than raw strength ever would.',
     heartRole:'Heart strain tends to rise in surges tied to the pull-and-breathe phase rather than rising smoothly like freestyle.',
     problem:{title:'Feels effortful but covers little distance per stroke', why:'The glide phase is being rushed, so each stroke cycle is doing less work than it should.'},
     solution:['Consciously pause and glide after each pull before starting the next one','Slow the overall tempo — breaststroke rewards timing over turnover speed','Practice the kick and pull separately with a board before combining them again']},
    {id:'butterfly', name:'Butterfly', tag:'Power + full-body coordination',
     brainRole:'Widely considered the most technically demanding stroke — the two-beat kick and undulating body timing require near-total brain focus to sustain.',
     heartRole:'The highest heart-strain stroke per length of any swimming style, due to its full-body power demand.',
     problem:{title:'Falls apart (loses rhythm) after just a few strokes', why:'This is very normal — butterfly fatigues the coordination pattern before most people\'s muscles or lungs are actually the limiter.'},
     solution:['Train it in very short reps (10–15m) with full rest, rather than trying to sustain it','Practice the body undulation (dolphin kick) separately from the arm pull first','Mix butterfly arms with a flutter kick occasionally to isolate and rebuild the arm pattern alone']},
    {id:'pool-sprints', name:'Sprint intervals (pool)', tag:'Anaerobic speed',
     brainRole:'Short, maximal-effort lengths need a fast, decisive pacing commitment each rep — little time to think, mostly to execute.',
     heartRole:'Heart strain spikes hard per rep with only partial recovery between — similar in shape to track repeats, but the water keeps the absolute numbers lower.',
     problem:{title:'Times fall off sharply after just 2–3 reps', why:'Very short, maximal swimming efforts rely on anaerobic capacity that depletes fast — this is expected, not a sign of poor fitness.'},
     solution:['Extend rest between reps (60–90s) rather than shortening it to "keep up the pace"','Cap the set at the number of reps that hold a consistent time, then stop','Track consistency of times, not just the fastest one, as the real measure of the session']},
    {id:'endurance-swim', name:'Endurance / distance swim', tag:'Aerobic base',
     brainRole:'Long, steady swimming can become meditative once technique is automatic — mental fatigue here is more about monotony than coordination load.',
     heartRole:'Heart strain should stay flat and low for most of the swim, similar to an easy run — a slow drift upward late on signals fading technique efficiency, not just fitness.',
     problem:{title:'Heart rate creeps up even though pace feels the same', why:'Technique efficiency drops as shoulders fatigue, so more effort is needed to hold the same pace late in the swim.'},
     solution:['Break long swims into sets with brief rests to keep technique fresh, rather than one unbroken distance','Focus on stroke length (distance per stroke) rather than just stroke rate as fatigue sets in','Shorten the session if heart strain keeps climbing despite unchanged pace']},
    {id:'kickboard-drill', name:'Kickboard drills', tag:'Leg-isolated technique',
     brainRole:'Isolating the kick removes the arm-breathing coordination puzzle, which is exactly why it\'s used to rebuild leg technique specifically.',
     heartRole:'Heart strain is usually lower than full-stroke swimming for the same perceived effort, since the upper body isn\'t contributing propulsion.',
     problem:{title:'Barely moving despite kicking hard', why:'The kick is likely coming from the knees (bicycle-style) instead of the hips, which wastes most of the effort.'},
     solution:['Keep the kick narrow and originating from the hips, not the knees','Keep ankles relaxed and pointed rather than flexed','Use fins occasionally to feel what an efficient kick tempo should feel like']},
  ],
  yoga:[
    {id:'downdog', name:'Downward-facing dog', tag:'Foundational stretch',
     brainRole:'Focusing on long exhales here activates the parasympathetic (calming) nervous system, which is the main brain effect of this pose.',
     heartRole:'Heart strain should be low to moderate; the head-below-heart position naturally supports a calmer heart rate.',
     problem:{title:'Heart rate feels elevated, breath feels short', why:'Breath is being held or shortened, often from gripping the shoulders too hard, which blocks the calming effect the pose is meant to give.'},
     solution:['Bend the knees generously to release the hamstrings and low back','Lengthen the exhale until it\'s longer than the inhale','Rest in child\'s pose if breath can\'t settle within a few breaths']},
    {id:'warrior2', name:'Warrior II', tag:'Standing strength',
     brainRole:'Holding a fixed gaze (drishti) while the legs work builds focus under physical load — a mild, controlled brain-load pose.',
     heartRole:'Heart strain rises modestly from the isometric leg hold — normal, and it should plateau rather than keep climbing.',
     problem:{title:'Legs shake and heart rate keeps climbing', why:'The front knee has likely drifted past the ankle, or the hold is longer than current leg strength supports.'},
     solution:['Stack the front knee directly over the ankle','Shorten the hold time and rebuild duration gradually','Sink less deep until the pose can be held without shaking']},
    {id:'tree-pose', name:'Tree pose', tag:'Balance',
     brainRole:'Balance poses demand continuous small brain corrections — this is a cognitive-load pose more than a strength one.',
     heartRole:'Heart rate should barely move; a spike usually reflects frustration or bracing, not physical effort.',
     problem:{title:'Can\'t hold it, keeps toppling', why:'Fixing the gaze on a moving point (or a phone/mirror) removes the visual anchor the brain needs for balance.'},
     solution:['Pick one still point at eye level and hold your gaze there','Press the lifted foot and standing leg into each other actively','Practice near a wall until balance improves']},
    {id:'pigeon', name:'Pigeon pose', tag:'Hip opener',
     brainRole:'Deep stretches trigger a protective brain response (guarding) if the nervous system doesn\'t trust the position yet — that guarding is felt as tightness.',
     heartRole:'Heart strain should stay low; if it rises, it usually means the breath has stopped, not that the hip is working harder.',
     problem:{title:'Hip won\'t release, feels tight every time', why:'The nervous system is bracing against the stretch because it\'s being forced rather than eased into.'},
     solution:['Prop the hip with a cushion so the position feels supported, not forced','Breathe into the stretch for 5+ slow breaths before expecting release','Back off the depth by 20–30% and hold longer instead of going deeper']},
    {id:'sun-salutation', name:'Sun salutation flow', tag:'Dynamic warm-up',
     brainRole:'Linking breath to movement (one breath per movement) is what shifts this from exercise into a brain-calming, meditative flow.',
     heartRole:'Heart rate should rise gently through the flow as a natural warm-up, without ever feeling like cardio.',
     problem:{title:'Feels rushed, heart rate spikes like cardio', why:'Movement is outrunning the breath, turning a calming flow into an accidental cardio set.'},
     solution:['Slow the pace until each movement matches one full breath','Add an extra breath at forward fold and downward dog','Reduce the number of rounds before adding speed back']},
    {id:'savasana', name:'Savasana (final relaxation)', tag:'Recovery / integration',
     brainRole:'This pose is where the brain consolidates the parasympathetic shift built during the practice — skipping it undoes some of the calming effect.',
     heartRole:'Heart rate should reach its lowest point of the whole session here.',
     problem:{title:'Mind stays busy, can\'t settle', why:'Ending the practice on a stimulating pose or rushing straight into it doesn\'t give the nervous system time to downshift.'},
     solution:['Add 1–2 minutes of slow breathing before lying down','Keep the room quiet and dim if possible','Stay at least 5 minutes — cutting it short removes most of the benefit']},
    {id:'cat-cow', name:'Cat-Cow flow', tag:'Spinal mobility',
     brainRole:'Syncing breath to spinal movement (inhale to arch, exhale to round) is a simple but effective brain-calming pattern often used to start a practice.',
     heartRole:'Minimal heart demand — this is a warm-up and mobility move, not a conditioning one.',
     problem:{title:'Feels stiff and mechanical rather than flowing', why:'Movement is happening without the breath, so the spine moves but the calming nervous-system effect doesn\'t show up.'},
     solution:['Slow down until each phase matches one full inhale or exhale','Move from the whole spine, not just the neck or lower back','Do a few extra rounds before judging whether it "worked" — the effect builds over reps']},
    {id:'bridge-pose', name:'Bridge pose', tag:'Backbend / glute activation',
     brainRole:'A gentle backbend that also asks the brain to actively fire the glutes rather than let the lower back do all the lifting.',
     heartRole:'Heart strain stays low; a mild rise usually comes from breath-holding during the lift, not the effort itself.',
     problem:{title:'Lower back feels it more than the glutes', why:'Glute activation is weak or fatigued, so the lift is coming from arching the lower back instead.'},
     solution:['Squeeze the glutes deliberately before and during the lift','Press evenly through both feet rather than pushing through the toes','Lower the hip height slightly if the lower back is doing most of the work']},
    {id:'seated-forward-fold', name:'Seated forward fold', tag:'Hamstring / nervous system release',
     brainRole:'Forward folds are classically calming — folding the body inward tends to shift the nervous system toward rest.',
     heartRole:'Heart rate should be among the lowest of any pose in a session, similar to Savasana.',
     problem:{title:'Feels agitating rather than calming', why:'Straining to reach the toes engages the nervous system\'s effort response, working against the pose\'s intent.'},
     solution:['Bend the knees generously — reaching a "deep" fold matters far less than relaxing into it','Let the head and neck hang heavy rather than holding tension there','Stay for 5+ breaths without adjusting deeper — depth isn\'t the goal here']},
    {id:'vinyasa-flow', name:'Vinyasa flow', tag:'Dynamic, breath-linked sequence',
     brainRole:'Continuously linking new poses to breath keeps brain engagement moderate-to-high throughout — more mentally active than a static hold-based practice.',
     heartRole:'Heart rate rises and falls through the sequence, staying moderate overall — a middle ground between yoga\'s usual calm and true cardio.',
     problem:{title:'Session starts feeling like a workout, not a flow', why:'Pace has outrun the breath across multiple poses in a row, turning the practice cardiovascular rather than meditative.'},
     solution:['Return to matching one breath per movement, even if it means moving slower than the class or video','Skip a jump-back or jump-through and step instead if breath is being lost there','Insert a brief child\'s pose to reset breath before continuing the sequence']},
    {id:'yin-hold', name:'Yin yoga long hold', tag:'Deep connective-tissue release (3–5 min holds)',
     brainRole:'Long passive holds test the brain\'s ability to stay with discomfort without tensing against it — the mental skill is arguably the main point of yin.',
     heartRole:'Heart rate should be very low and stable — yin is a passive, still practice with minimal muscular effort.',
     problem:{title:'Restlessness or clock-watching before the hold ends', why:'The nervous system is still in an active, effort-oriented mode rather than the passive state yin requires.'},
     solution:['Start with shorter holds (60–90s) and build toward the full 3–5 minutes over weeks','Use slow counted breathing as an anchor instead of watching the clock','Reduce the pose\'s depth slightly — restlessness is often a response to too much sensation, not too little time']},
  ],
  hiit:[
    {id:'burpees', name:'Burpees', tag:'Full body',
     brainRole:'Coordinating a fast multi-step movement under fatigue is highly brain-demanding — form breaks down here first, before the muscles fail.',
     heartRole:'One of the fastest heart-rate spikes of any HIIT move — expect it to climb hard within a few reps.',
     problem:{title:'Form falls apart after a few reps', why:'Brain-driven coordination degrades faster than the muscles do, so speed outpaces control.'},
     solution:['Step back into the plank instead of jumping when fatigued','Slow the tempo slightly rather than dropping reps','Shorten the work interval and keep intensity high instead']},
    {id:'kb-swing', name:'Kettlebell swings', tag:'Posterior chain / power',
     brainRole:'The hip-hinge pattern relies on a strong brain-to-glute signal; when that signal fades, the lower back takes over instead.',
     heartRole:'Heart strain builds quickly and steadily across a set, similar to a short sprint.',
     problem:{title:'Lower back feels it instead of the glutes/hamstrings', why:'The movement has turned into a squat-and-lift rather than a hip hinge, usually from fatigue or rushing the tempo.'},
     solution:['Reset with a few slow, deliberate hinges before speeding up','Cue "hips back" rather than "swing the arms"','Reduce weight until the hinge pattern stays clean under fatigue']},
    {id:'jump-squat', name:'Jump squats', tag:'Lower body power',
     brainRole:'Explosive output depends on fresh nervous-system drive — this move fatigues brain-to-muscle signaling fast.',
     heartRole:'Heart rate rises sharply; landing mechanics also depend on the heart delivering oxygen fast enough to legs already under load.',
     problem:{title:'Jump height drops off quickly', why:'Nervous-system fatigue is limiting power output before the legs are actually out of strength.'},
     solution:['Keep sets short (6–10 reps) so quality stays high','Rest fully between sets rather than rushing the next round','Swap to bodyweight squats once jump height clearly drops']},
    {id:'battle-ropes', name:'Battle ropes', tag:'Upper body / conditioning',
     brainRole:'Rapid alternating arm patterns need continuous brain coordination, which is why form (not just arms) tires quickly.',
     heartRole:'Heart rate climbs fast and stays high — one of the more cardiovascular-dominant HIIT moves.',
     problem:{title:'Waves get small and sloppy fast', why:'Shoulders are doing isolated small movements instead of using the legs and core to drive the wave.'},
     solution:['Bend the knees and use a slight squat rhythm to drive the wave','Shorten intervals to 15–20s if waves collapse earlier than that','Keep shoulders down away from the ears throughout']},
    {id:'box-jump', name:'Box jumps', tag:'Explosive power',
     brainRole:'Landing safely requires quick brain-driven joint control — this degrades noticeably as fatigue builds.',
     heartRole:'Heart rate spikes per rep with brief recovery between — a stop-start cardiac pattern rather than sustained strain.',
     problem:{title:'Landings feel heavy or unstable', why:'Coordination fatigue (brain) is arriving before leg strength runs out, raising injury risk on landing.'},
     solution:['Step down instead of jumping down between reps','Stop the set once landings feel noticeably less controlled','Lower the box height rather than pushing through poor landings']},
    {id:'mtn-climbers', name:'Mountain climbers', tag:'Core / conditioning',
     brainRole:'Keeping the core braced while the limbs move fast needs steady brain-to-core signaling that fades under fatigue.',
     heartRole:'Heart rate rises quickly and sustains — a good marker of true cardiovascular conditioning intensity.',
     problem:{title:'Hips rise up, lower back rounds', why:'Core bracing has fatigued first, so the hips pike up to compensate and take load off the midline.'},
     solution:['Slow the pace to restore a flat back before speeding back up','Shorten the interval so form holds for the whole set','Rest the knees on the ground briefly rather than letting hips pike']},
    {id:'tabata-sprint', name:'Tabata sprints', tag:'Max-effort intervals (20s on / 10s off)',
     brainRole:'The very short work window forces an all-out effort decision every round — high brain arousal, minimal pacing strategy needed.',
     heartRole:'Heart strain spikes almost immediately each round and barely has time to drop in the short rest — one of the highest average-strain formats here.',
     problem:{title:'Later rounds feel identical in effort but output crashes', why:'Ten seconds is not enough recovery once anaerobic capacity is used up, so effort stays maximal while actual power output falls.'},
     solution:['Cap Tabata blocks at the classic 8 rounds (4 minutes) rather than extending them','Choose a simple movement so form doesn\'t need brain bandwidth you don\'t have','Stop the format (not just the rep) if the 10s rest stops feeling like any recovery at all']},
    {id:'assault-bike', name:'Assault bike sprints', tag:'Full-body cardio power',
     brainRole:'Arms and legs driving together demands more coordination than cycling alone, but the sitting position keeps injury-risk decisions simpler than jumping moves.',
     heartRole:'Very fast heart-rate spikes with fan resistance scaling to effort — harder pushes always cost more strain, unlike a fixed-pace treadmill.',
     problem:{title:'Legs give out but arms still feel fine (or vice versa)', why:'One half of the body is compensating for the other rather than both driving evenly, usually from muscular fatigue asymmetry.'},
     solution:['Consciously drive through both arms and legs equally each stroke','Shorten intervals if one side is clearly carrying the other','Alternate arm-only and leg-only short bursts in warm-up to notice imbalance early']},
    {id:'row-intervals', name:'Rowing intervals', tag:'Full-body / posterior chain',
     brainRole:'Sequencing legs-back-arms correctly needs real technical focus — this is closer to a skill than a simple cardio push.',
     heartRole:'Heart strain rises with stroke rate and force together — a common mistake is pulling harder with the arms instead of the legs, which spikes strain without matching power output.',
     problem:{title:'Lower back tightens before legs or lungs give out', why:'Rowing has become an arm-and-back pull instead of a leg drive, overloading the lower back with every stroke.'},
     solution:['Cue "legs, then back, then arms" on the drive, and reverse it on the recovery','Lower the stroke rate and focus on power-per-stroke instead of speed','Shorten intervals until the leg-drive sequence holds up for the whole piece']},
    {id:'plyo-lunge', name:'Plyometric (jump) lunges', tag:'Unilateral lower body power',
     brainRole:'Balancing single-leg landings under fatigue is one of the higher brain-coordination demands in this list.',
     heartRole:'Heart rate rises sharply and stays elevated due to the continuous single-leg loading.',
     problem:{title:'Landings feel wobbly or knees cave inward', why:'Single-leg stability control (a brain-driven skill) is fatiguing faster than the leg muscles themselves.'},
     solution:['Slow down to alternating reverse lunges once wobbling starts, rather than pushing through jumps','Keep the front knee tracking over the toes on every landing, even when tired','Shorten sets to preserve landing quality over rep count']},
  ],
  hybrid:[
    {id:'ski-erg', name:'SkiErg', tag:'Full-body pulling power (station training)',
     brainRole:'A new pulling pattern for most people — early sessions need real conscious coordination between the hip hinge and the arm pull.',
     heartRole:'Heart strain climbs quickly since it engages both upper body and posterior chain at once, similar to rowing but more upper-body dominant.',
     problem:{title:'Arms burn out long before legs or lungs do', why:'The movement has become an arm-pulldown instead of using the hips to initiate the pull, overloading the smaller arm muscles.'},
     solution:['Initiate every pull from the hips folding forward, not the arms','Keep the pace moderate on the first station of a hybrid session — this one punishes an early sprint','Shorten work bouts if grip or arms fatigue faster than the rest of the body']},
    {id:'sled-push', name:'Sled push', tag:'Lower body power (station training)',
     brainRole:'A simple movement pattern, but full-effort pushing under fatigue tests how well the brain keeps torso and leg drive coordinated when everything wants to round forward.',
     heartRole:'One of the highest heart-strain spikes of any station — near-maximal effort against constant resistance with nowhere to ease off mid-push.',
     problem:{title:'Upper back rounds and steps get short and choppy', why:'Leg drive is fatiguing, so the torso is compensating by leaning and pushing with the arms instead of the legs.'},
     solution:['Keep the chest up and hips low rather than folding over the sled','Take slightly shorter, faster steps instead of long, straining ones','Break the push into shorter efforts with brief resets rather than one long grind']},
    {id:'sled-pull', name:'Sled pull (rope or harness)', tag:'Posterior chain (station training)',

     heartRole:'Heart strain builds steadily rather than spiking — a sustained-effort station rather than an explosive one.',
     problem:{title:'Lower back does the work instead of legs and lats', why:'Pulling with a rounded back and straight legs rather than a strong leg drive with each pull.'},
     solution:['Sit back into the pull like a partial squat with each rep','Keep the spine neutral and let the legs, not the back, generate force','Shorten the distance per set if form breaks down before the target distance']},
    {id:'farmers-carry', name:'Farmer\'s carry', tag:'Grip + full-body stability (station training)',
     brainRole:'Requires continuous brain-driven bracing through the whole body to keep posture upright under an off-balancing load.',
     heartRole:'Heart strain rises from the isometric full-body tension as much as from the walking itself.',
     problem:{title:'Shoulders shrug up and gait gets uneven', why:'Grip or shoulder stability is fatiguing before the legs, so the body compensates by hiking the shoulders and shortening stride.'},
     solution:['Keep shoulders pulled down and back, not up toward the ears','Take normal-length steps rather than rushing into a shuffle','Set the weight down and reset grip rather than fighting through a failing grip']},
    {id:'wall-ball', name:'Wall balls', tag:'Full-body power + conditioning (station training)',
     brainRole:'Combining a squat with a throw and catch under fatigue is a genuinely complex coordination task — this is where technique failure shows up first.',
     heartRole:'Heart strain climbs fast since it\'s a full-body movement performed at high rep count with almost no rest between reps.',
     problem:{title:'Ball keeps missing the target or the catch gets messy', why:'Brain-driven timing between the squat drive and the throw is degrading before the legs or shoulders are actually out of strength.'},
     solution:['Slow the tempo slightly to resync the squat-to-throw timing','Aim for a slightly lower target height temporarily if accuracy keeps slipping','Break a long set into smaller sets with brief holds rather than forcing through sloppy reps']},
    {id:'burpee-broad-jump', name:'Burpee broad jumps', tag:'Full-body power + distance (station training)',
     brainRole:'Combines the coordination demand of a burpee with a distance-judgment task on the jump — a lot of simultaneous brain-driven decisions per rep.',
     heartRole:'One of the highest combined heart-strain movements in hybrid formats, similar to burpees but with added landing demand.',
     problem:{title:'Jump distance shrinks and landings get rougher', why:'Coordination fatigue is limiting jump quality before leg strength is actually the limiter.'},
     solution:['Switch to a burpee with a step-forward instead of a jump once distance clearly drops','Land with soft knees and pause briefly before the next rep rather than rushing','Track total distance covered rather than rep count to keep quality honest']},
    {id:'brick-workout', name:'Brick workout (e.g. bike-to-run or lift-to-row)', tag:'Cross-modal endurance (station training)',
     brainRole:'Switching physical systems (cycling legs to running legs, or heavy lifting to fast cardio) forces the brain to re-adapt motor patterns mid-session, which is mentally taxing in its own right.',
     heartRole:'Heart rate often spikes right at the transition between disciplines, even if effort feels similar — this is a well-known effect in multi-sport training.',
     problem:{title:'Legs feel heavy and clumsy right after the transition', why:'Blood flow and muscle recruitment patterns are still adjusting from the previous discipline — a normal, temporary effect, not a sign of an injury.'},
     solution:['Practice the transition itself, not just each discipline separately','Ease into the first minute or two of the new discipline rather than attacking it at full pace','Give the transition effect 3–5 minutes to fade before judging how the session is actually going']},
  ],
  general:[
    {id:'full-body-circuit', name:'Full-body circuit', tag:'Strength + conditioning',
     brainRole:'Switching between different movement patterns station to station keeps brain engagement high throughout.',
     heartRole:'Heart strain rises in waves as strength and cardio-style stations alternate — expect it to stay moderately elevated the whole circuit.',
     problem:{title:'Later stations feel much harder than earlier ones', why:'Heart strain from earlier stations hasn\'t cleared before the next one starts, so fatigue compounds faster than expected.'},
     solution:['Add 15–20s extra rest between stations','Reorder so the most demanding stations aren\'t back-to-back','Track heart level between stations and don\'t start the next until it settles']},
    {id:'cardio-machine', name:'Cardio machine session', tag:'Steady-state cardio',
     brainRole:'Lower cognitive demand — mental fatigue here mostly comes from boredom or pacing decisions, not the movement itself.',
     heartRole:'Heart level should sit in a steady, predictable range for the whole session, matching the resistance/speed you\'ve set.',
     problem:{title:'Heart rate keeps rising at the same setting', why:'Cardiac drift, often from heat, dehydration, or accumulated fatigue from previous sessions this week.'},
     solution:['Lower resistance/speed slightly to bring heart rate back in range','Hydrate before and during longer sessions','Check whether this session is too soon after a hard one earlier in the week']},
    {id:'functional-kb', name:'Functional / kettlebell training', tag:'Mixed strength',
     brainRole:'Compound, multi-joint movements need continuous whole-body coordination — brain load is higher than isolated machine work.',
     heartRole:'Heart strain varies a lot by movement — expect swings and carries to spike it more than presses or holds.',
     problem:{title:'Coordination breaks down mid-session', why:'Brain-driven coordination fatigues before the target muscles are fully worked, especially on complex or new movements.'},
     solution:['Practice new movement patterns early in the session while fresh','Lower load on complex lifts before lowering load on simple ones','Break complex movements into their parts if form keeps slipping']},
    {id:'core-stability', name:'Core & stability work', tag:'Trunk / balance',
     brainRole:'Stability work relies on constant small brain corrections — similar demand to balance-based yoga poses.',
     heartRole:'Heart strain should stay low to moderate; a spike usually means bracing or breath-holding, not real cardiovascular effort.',
     problem:{title:'Shaking or losing form quickly', why:'Breath is being held to brace, which spikes heart strain and speeds up fatigue rather than helping stability.'},

function statusFor(v){ return v<35?'Calm':v<60?'Elevated':v<80?'High':'Critical'; }
function statusColorHex(v){ return v<35?JS_COLORS.teal:v<60?JS_COLORS.amber:v<80?'#E8793C':JS_COLORS.heart; }
function stageFor(brain,heart,minute,cortisol){
  if(minute<=1) return 'warmup';
  const c = cortisol===undefined ? 0 : cortisol;
  const idx = brain*0.4 + heart*0.4 + c*0.2;
  if(idx>=78) return 'risk';
  if(idx>=55) return 'effort';
  return 'optimal';
}
function cortisolStatus(v){ return v<30?'Balanced':v<55?'Rising':v<75?'Elevated':'Chronically high'; }
function cortisolColorHex(v){ return v<30?JS_COLORS.teal:v<55?JS_COLORS.amber:v<75?'#E8793C':JS_COLORS.heart; }

/* ---------------- creative chart helpers (pure SVG, no library) ---------------- */
const JS_COLORS = {brain:'#9B87F5', heart:'#F2637A', teal:'#33C793', amber:'#E3A23C'};

function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h = Math.imul(31,h) + str.charCodeAt(i) | 0; } return Math.abs(h); }
function seededCurve(seed, n){
  const arr = [];
  for(let i=0;i<n;i++){
    let x = Math.sin(seed*0.017 + i*12.9898) * 43758.5453;
    x = x - Math.floor(x);
    arr.push(Math.round(18 + x*72));
  }
  return arr;
}
function sparkPathFromValues(values, w, h){
  const n = values.length-1;
  return values.map((v,i)=>`${((i/n)*w).toFixed(1)},${(h-(v/100)*h).toFixed(1)}`).join(' ');
}

function svgRadar(labels, values, colorHex, size){
  size = size||190;
  const n = labels.length, cx=size/2, cy=size/2, r=size/2-30;
  const ptAt = (i,frac)=>{ const a=(Math.PI*2*i/n)-Math.PI/2; return [cx+r*frac*Math.cos(a), cy+r*frac*Math.sin(a)]; };
  const rings = [0.33,0.66,1].map(f=>`<polygon points="${labels.map((_,i)=>ptAt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--border)" stroke-width="1"/>`).join('');
  const spokes = labels.map((_,i)=>{ const p=ptAt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`; }).join('');
  const poly = values.map((v,i)=>ptAt(i,Math.max(0.06,v/100)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const labelEls = labels.map((l,i)=>{ const p=ptAt(i,1.22); return `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" font-size="9.5" fill="var(--text-dim)" text-anchor="middle" dominant-baseline="middle" font-family="Inter">${l}</text>`; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}${spokes}<polygon points="${poly}" fill="${colorHex}33" stroke="${colorHex}" stroke-width="2"/>${labelEls}</svg>`;
}
function svgRing(percent, colorHex, size, label){
  size = size||128; const strokeW=11; const r=size/2-strokeW;
  const c=2*Math.PI*r; const dash=c*(Math.max(0,Math.min(100,percent))/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${strokeW}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colorHex}" stroke-width="${strokeW}" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+3}" font-size="21" font-weight="600" fill="var(--text)" text-anchor="middle" font-family="Space Grotesk">${Math.round(percent)}%</text>
    ${label?`<text x="${size/2}" y="${size/2+19}" font-size="9" fill="var(--text-faint)" text-anchor="middle" font-family="Inter">${label}</text>`:''}
  </svg>`;
}
function svgDecayBars(values, colorHex){
  const w=280,h=92; const gap=w/values.length; const bw=gap*0.56;
  const bars = values.map((v,i)=>{ const bh=(v/100)*h; const x=i*gap+(gap-bw)/2; const op=(0.4+0.6*(v/100)).toFixed(2);
    return `<rect x="${x.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${colorHex}" opacity="${op}"/>`; }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">${bars}<line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--border)" stroke-width="1"/></svg>`;
}
function svgDualLine(splits){
  const w=280,h=92,n=splits.length;
  const paces = splits.map(s=>s.pace); const maxP=Math.max(...paces), minP=Math.min(...paces);
  const hrPts = splits.map((s,i)=>`${((i/(n-1))*w).toFixed(1)},${(h-(s.hr/100)*h).toFixed(1)}`).join(' ');
  const pacePts = splits.map((s,i)=>{ const norm = maxP===minP?0.5:(s.pace-minP)/(maxP-minP); const y = h*0.12 + (1-norm)*h*0.76; return `${((i/(n-1))*w).toFixed(1)},${y.toFixed(1)}`; }).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${hrPts}" fill="none" stroke="${JS_COLORS.heart}" stroke-width="2.2"/>
    <polyline points="${pacePts}" fill="none" stroke="${JS_COLORS.teal}" stroke-width="2.2" stroke-dasharray="5 4"/>
  </svg>`;
}
function svgDonut(segments, size){
  // segments: [{value, colorHex}], values sum to ~100
  size = size||120; const strokeW=16; const r=size/2-strokeW; const c=2*Math.PI*r;
  let offset=0;
  const arcs = segments.map(seg=>{
    const len = c*(seg.value/100);
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.colorHex}" stroke-width="${strokeW}" stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offset += len; return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}

/* Build category-specific creative data from a session's timeline */
function buildCategoryExtra(activity, tl){
  const avgBrain = Math.round(tl.reduce((s,r)=>s+r[1],0)/tl.length);
  const avgHeart = Math.round(tl.reduce((s,r)=>s+r[2],0)/tl.length);
  if(activity==='bodybuilding'){
    const base = ['Biceps','Chest','Back','Legs','Shoulders','Triceps'];
    const muscles = {};
    base.forEach((m,i)=>{ muscles[m] = Math.max(20, Math.min(95, Math.round((avgBrain*0.5+avgHeart*0.5) + (seededCurve(hashSeed(m+activity),1)[0]-55)*0.6))); });
    return {muscles};
  }
  if(activity==='running'){
    const splits = tl.map(([m,b,h],i)=>({pace: +(6.2 - (h/100)*1.6).toFixed(2), hr:h}));
    return {splits};
  }
  if(activity==='swimming'){
    const splits = tl.map(([m,b,h],i)=>({pace: +(2.4 - (h/100)*0.9).toFixed(2), hr:h}));
    return {splits};
  }
  if(activity==='yoga'){
    const calmScore = Math.max(5, 100-avgHeart);
    return {calmScore};
  }
  if(activity==='hiit'){
    const peak = Math.max(...tl.map(r=>r[2]));
    const intervals = tl.map(([m,b,h])=>Math.round(100 - (peak-h)*0.15 - (h/peak)*10));
    return {intervals:intervals.map(v=>Math.max(35,Math.min(100,v)))};
  }
  if(activity==='hybrid'){
    const stations = ['SkiErg','Sled push','Sled pull','Farmers carry','Wall balls','Row','Burpee jumps'];
    const effort = stations.map(s=>Math.max(40, Math.min(100, Math.round((avgHeart*0.5+avgBrain*0.5) + (seededCurve(hashSeed(s+activity),1)[0]-55)*0.5))));
    return {stations, effort};
  }
  // general
  const stages = tl.map(([m,b,h,c])=>stageFor(b,h,m,c));
  const counts = {warmup:0,optimal:0,effort:0,risk:0};
  stages.forEach(s=>counts[s]++);
  const total = stages.length;
  return {zones:{warmup:Math.round(counts.warmup/total*100), optimal:Math.round(counts.optimal/total*100), effort:Math.round(counts.effort/total*100), risk:Math.round(counts.risk/total*100)}};
}

function renderCategoryChart(activity, extra){
  if(activity==='bodybuilding'){
    const labels = Object.keys(extra.muscles);
    const values = Object.values(extra.muscles);
    return `<div style="display:flex; flex-direction:column; align-items:center;">
      ${svgRadar(labels, values, JS_COLORS.brain)}
      <p class="muted" style="text-align:center; margin-top:2px;">Pump map — brain+heart engagement by muscle group this session.</p>
    </div>`;
  }
  if(activity==='running'){
    return `${svgDualLine(extra.splits)}
      <div class="zonekey" style="margin-top:6px;"><div class="k"><div class="sw" style="background:${JS_COLORS.heart};"></div>Heart strain</div><div class="k"><div class="sw" style="background:${JS_COLORS.teal};"></div>Pace (dashed, higher = faster)</div></div>`;
  }
  if(activity==='swimming'){
    return `${svgDualLine(extra.splits)}
      <div class="zonekey" style="margin-top:6px;"><div class="k"><div class="sw" style="background:${JS_COLORS.heart};"></div>Heart strain</div><div class="k"><div class="sw" style="background:${JS_COLORS.teal};"></div>Lap pace (dashed, higher = faster)</div></div>`;
  }
  if(activity==='yoga'){
    return `<div style="display:flex; align-items:center; gap:16px;">
      ${svgRing(extra.calmScore, JS_COLORS.teal, 128, 'calm reached')}
      <p class="muted" style="margin:0;">Calm score compares how low your heart strain settled versus the start of the practice. Higher means a deeper parasympathetic shift.</p>
    </div>`;
  }
  if(activity==='hiit'){
    return `${svgDecayBars(extra.intervals, JS_COLORS.amber)}
      <p class="muted" style="margin-top:2px;">Power output per interval — the drop-off shows where nervous-system fatigue set in.</p>`;
  }
  if(activity==='hybrid'){
    return `${svgDecayBars(extra.effort, JS_COLORS.brain)}
      <div class="zonekey" style="margin-top:4px; flex-wrap:wrap;">${extra.stations.map(s=>`<div class="k">${s}</div>`).join('')}</div>
      <p class="muted" style="margin-top:6px;">Relative effort by station, left to right — the pattern shows which stations cost you the most combined brain+heart load today.</p>`;
  }
  const z = extra.zones;
  return `<div style="display:flex; align-items:center; gap:16px;">
    ${svgDonut([{value:z.optimal,colorHex:JS_COLORS.teal},{value:z.effort,colorHex:JS_COLORS.amber},{value:z.risk,colorHex:JS_COLORS.heart},{value:z.warmup,colorHex:'#3A473F'}], 120)}
    <div class="zonekey" style="flex-direction:column; gap:6px; align-items:flex-start;">
      <div class="k"><div class="sw" style="background:${JS_COLORS.teal};"></div>Optimal ${z.optimal}%</div>
      <div class="k"><div class="sw" style="background:${JS_COLORS.amber};"></div>High effort ${z.effort}%</div>
      <div class="k"><div class="sw" style="background:${JS_COLORS.heart};"></div>Risk ${z.risk}%</div>
      <div class="k"><div class="sw" style="background:#3A473F;"></div>Warm-up ${z.warmup}%</div>
    </div>
  </div>`;
}

/* ---------------- persistence: remember the user's own data between
   launches, so this behaves like an installed app and not a page that
   forgets everything on refresh. Demo/reference data (historySessions,
   weekLog) stays as shipped; only things the user actually set are saved. */
const PERSIST_KEY = 'neuropulsefit.state.v1';
const PERSIST_FIELDS = ['consentGiven','profile','devices','today','bodyProfile','sleepHours','soreness','foodCuisine'];
function saveState(){
  try{
    const toSave = {};
    PERSIST_FIELDS.forEach(k=>toSave[k]=state[k]);
    localStorage.setItem(PERSIST_KEY, JSON.stringify(toSave));
  }catch(e){ /* private browsing or storage full — app still works, just won't remember */ }
}
function loadState(){
  try{
    const raw = localStorage.getItem(PERSIST_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    PERSIST_FIELDS.forEach(k=>{ if(saved[k]!==undefined) state[k]=saved[k]; });
    if(state.consentGiven) state.screen = 'live';
  }catch(e){ /* ignore corrupt/missing data, defaults already in state */ }
}
loadState();

function logEvent(name, detail){ state.eventLog.unshift({name, detail}); }
function go(screen){ state.screen = screen; if(screen!=='live') stopLiveTimer(); render(); }
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 1900);
}

        <div><div style="font-size:13px; font-weight:500;">View workouts &amp; technique guide</div><div class="label">See the moves, positions and fixes for this activity</div></div>
        <span style="color:var(--text-faint);">›</span>
      </div>

      <button class="btn primary" onclick="startSession()">${BTN_ICONS.play} Start training</button>

}
function startSession(){
  const a = ACTIVITIES.find(a=>a.id===state.today.activity);
  state.session = {active:true, paused:false, name:a.name, minuteIdx:0};
  state.alerts = [];
  state.recoveryChecked = {};
  logEvent('session_started', a.name);
  go('live');
}

function currentReading(){
  const tl = TIMELINES[state.today.activity];
  const i = Math.min(state.session.minuteIdx, tl.length-1);
  const [minute, brain, heart, cortisol] = tl[i];
  return {minute, brain, heart, cortisol, isLast:i===tl.length-1};
}

function maybeRaiseAlert(){
  const {brain,heart,minute,cortisol} = currentReading();
  const stage = stageFor(brain,heart,minute,cortisol);
  if(stage==='risk' && !state.alerts.some(a=>!a.dismissed)){
    const p = RISK_PROFILE[state.today.activity];
    const id = 'a'+Date.now();
    const cortisolNote = cortisol>=75 ? ' Cortisol is also elevated and tends to stay high longer than heart rate does, so plan recovery for after this feeling passes, not just until it does.' : '';
    state.alerts.push({
      id, ramp: p.trigger==='brain'?'brain':'heart',
      metricLabel: p.trigger==='brain'?'Brain load':p.trigger==='heart'?'Heart strain':'Brain load & heart strain',
      brain, heart, cortisol, why:p.why+cortisolNote, recs:p.recs, read:false, dismissed:false,
    });
    logEvent('risk_alert_raised', state.today.activity);
    showToast('New alert — overreaching risk detected');
  }
}

function startLiveTimer(){
  stopLiveTimer();
  state.liveTimer = setInterval(()=>{
    if(!state.session.active || state.session.paused) return;
    const tl = TIMELINES[state.today.activity];
    if(state.session.minuteIdx < tl.length-1) state.session.minuteIdx++;
    maybeRaiseAlert();
    render();
  }, 2200);
}
function stopLiveTimer(){ if(state.liveTimer){ clearInterval(state.liveTimer); state.liveTimer=null; } }

    </div>
    ${state.session.paused?`<div class="banner" style="background:var(--surface-2); color:var(--text-dim);">Paused — signal not updating.</div>`:''}
    <div class="stage-banner ${meta.cls}">

    </div>

      </div>

        <div class="g-num">${heart}</div>
        <div class="g-status" style="color:${statusColorHex(heart)};">${statusFor(heart)}</div>
        <div class="g-bar"><div class="fill" style="width:${heart}%; background:${statusColorHex(heart)};"></div></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px; border-color:${cColor}40; box-shadow:0 0 0 1px ${cColor}22, 0 0 18px ${cColor}1f;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
        <div style="display:flex; align-items:center; gap:6px;"><div style="width:7px; height:7px; border-radius:50%; background:${cColor};"></div><div class="label">Cortisol (stress hormone)</div></div>

    </div>
    <div class="card signal-card">

      </svg>
      <div class="zonekey" style="margin-top:6px;"><div class="k"><div class="sw" style="background:var(--brain);"></div>Brain</div><div class="k"><div class="sw" style="background:var(--heart);"></div>Heart</div><div class="k"><div class="sw" style="background:${JS_COLORS.amber};"></div>Cortisol</div></div>
    </div>
    <div class="label" style="margin:14px 0 8px;">Alerts</div>
    ${activeAlerts.length===0?`<p class="muted">No active alerts — signals within your normal range.</p>`:activeAlerts.map(a=>`
      <div class="alert-item ${a.ramp}" onclick="openAlert('${a.id}')">
        <span>${a.metricLabel} rising — possible overreaching</span>
        <span class="x" onclick="event.stopPropagation(); dismissAlert('${a.id}')">✕</span>
      </div>`).join('')}
    ${isLast?`<p class="muted" style="margin-top:6px;">End of this session's data.</p>`:''}
    <div class="btn-row" style="padding-top:0;">

function sparkPoints(activity, key){
  const tl = TIMELINES[activity];
  const n = tl.length-1;
  return tl.map((row,i)=>{
    const v = key==='brain'?row[1]:key==='heart'?row[2]:row[3];
    const x = (i/n)*300;
    const y = 40 - (v/100)*36;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function togglePause(){ state.session.paused=!state.session.paused; logEvent(state.session.paused?'session_paused':'session_resumed'); render(); }
function dismissAlert(id){ const a=state.alerts.find(a=>a.id===id); a.dismissed=true; showToast('Alert dismissed'); render(); }
function openAlert(id){ state.activeAlert=id; const a=state.alerts.find(a=>a.id===id); a.read=true; go('alertExplain'); }

function screenAlertExplain(){

function endSession(){
  stopLiveTimer();
  logEvent('session_ended', state.today.activity);
  state.session.active = false;
  const tl = TIMELINES[state.today.activity];
  const avgBrain = Math.round(tl.reduce((s,r)=>s+r[1],0)/tl.length);
  const avgHeart = Math.round(tl.reduce((s,r)=>s+r[2],0)/tl.length);
  const avgCortisol = Math.round(tl.reduce((s,r)=>s+r[3],0)/tl.length);
  const extra = buildCategoryExtra(state.today.activity, tl);
  state.historySessions.unshift({label:'Today', activity:state.today.activity, avgBrain, avgHeart, avgCortisol, risk: state.alerts.length>0, extra});
  const dow = new Date().getDay(); // 0 sun .. 6 sat -> map to Mon..Sun index
  const idx = dow===0?6:dow-1;
  state.weekLog[idx] = true;
  go('summary');
}

  state.cameraError = '';
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false});
    state.cameraOn = true;
  }catch(e){
    state.cameraOn = false;
    state.cameraError = 'Camera isn\'t available here — search for the food below instead.';
  }
  render();
}
function stopCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream = null; }
  state.cameraOn = false;
}
function toggleCamera(){ state.cameraOn ? (stopCamera(), render()) : startCamera(); }
function setScannerQuery(v){ state.scannerQuery = v; render(); }
function setScannerCuisineFilter(id){ state.scannerCuisineFilter = id; render(); }
function selectScanFood(cuisineId, foodId){
  state.scannerSelected = {cuisineId, foodId};
  go('scanResult');
}

function screenScanner(){

    <div class="card" style="margin-bottom:12px; text-align:center;">

        <video id="scannerVideo" autoplay playsinline style="width:100%; border-radius:10px; background:#000; max-height:220px; object-fit:cover;"></video>
        <p class="muted" style="margin:8px 0 0;">Point at your food, then find and confirm it below — matching what's on camera to the closest entry gives a more reliable read than automatic recognition.</p>

        <div style="padding:18px 0;">
          <div style="font-size:32px; margin-bottom:6px;">📷</div>

}

function screenScanResult(){
  if(!state.scannerSelected) return `<div class="topbar"><button class="back" onclick="go('scanner')">←</button><h2>Scan result</h2></div><p class="muted">No food selected.</p>`;
  const dish = FOOD_DISHES[state.scannerSelected.cuisineId].find(d=>d.id===state.scannerSelected.foodId);
  const cuisine = FOOD_CUISINES.find(c=>c.id===state.scannerSelected.cuisineId);
  const activity = state.today.activity;
  const targets = mealTargets(activity);
  const tdee = computeTDEE(state.bodyProfile);
  const portion = computeDishPortion(dish, targets, tdee);
  const fit = fitLabel(portion.scale);
  const scaleText = portion.scale<1 ? `~${Math.round(portion.scale*100)}% of` : `~${portion.scale.toFixed(1)}×`;
  const proteinShare = dish.per100.protein*4;
  const carbShare = dish.per100.carb*4;
  const fatShare = dish.per100.fat*9;
  const totalCal = proteinShare+carbShare+fatShare || 1;
  const proteinPct = Math.round(proteinShare/totalCal*100);
  let verdict;
  if(activity==='bodybuilding' || activity==='hiit' || activity==='hybrid'){
    verdict = proteinPct>=25 ? 'Good match — solid protein relative to calories for muscle repair after this kind of training.' : 'Works, but pair it with an extra protein source (egg, curd, dal, chicken) since this food alone is carb/fat-heavy for today\'s training goal.';
  } else if(activity==='running' || activity==='swimming'){
    verdict = dish.per100.carb>=15 ? 'Good match — enough carbohydrate here to help refill what endurance training used up.' : 'Works as a side, but add a carb-rich food alongside it (rice, banana, bread) to fully refuel from today\'s session.';
  } else if(activity==='yoga'){
    verdict = dish.per100.kcal<=180 ? 'Good match — light enough to sit well after a calming practice.' : 'A bit heavy for right after yoga — a smaller portion or a lighter pairing keeps the post-practice calm from being undone by digestion.';
  } else {
    verdict = 'Reasonable general-purpose food — check the portion below to keep it in line with today\'s activity.';
  }
  return `
    <div class="topbar"><button class="back" onclick="go('scanner')">←</button><h2>${dish.name}</h2></div>
    <span class="pill teal" style="margin-bottom:10px; display:inline-block;">${cuisine.emoji} ${cuisine.name}</span>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:13.5px; font-weight:600; margin-bottom:4px;">Does this work for you today?</div>
      <p class="muted" style="margin:0;">${verdict}</p>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;">
        <div class="label">Typical serving: ${dish.serving.desc}</div>
        <span class="pill ${fit.cls}">${fit.text}</span>
      </div>
      <div style="font-size:14px; font-weight:600; margin-bottom:2px;">Your portion: ~${portion.grams}g <span class="label" style="font-weight:400;">(${scaleText} a typical serving)</span></div>
      <div class="label">${portion.kcal} kcal · P ${portion.protein}g · C ${portion.carb}g · F ${portion.fat}g</div>
    </div>
    <p class="muted" style="margin-bottom:14px;">${dish.note}</p>
    ${dish.costTier && dish.costTier!=='budget' ? `
    <div class="label" style="margin-bottom:6px;">Can't get this, or it's out of budget?</div>
    <div class="card" style="margin-bottom:14px;">
      ${(dish.swaps&&dish.swaps.length) ? dish.swaps.map(s=>`
        <div class="recovery-item"><div class="check" style="border-color:var(--teal);"></div>
          <div><div>${s.name}</div><div class="label" style="margin-top:2px;">${s.reason}</div></div>
        </div>`).join('') : `<p class="muted" style="margin:0;">Check the "Budget staples" tab in the scanner for widely affordable swaps (eggs, milk, curd, dal, rice, oats, peanuts) that cover the same protein/carb role.</p>`}
    </div>` : `
    <div class="banner" style="background:var(--teal-dim); color:var(--teal); margin-bottom:14px;">This is already an affordable, widely available option — no swap needed.</div>`}
    <div class="btn-row"><button class="btn primary block" onclick="go('scanner')">${BTN_ICONS.arrow} Scan another food</button></div>`;
}

  const burn = computeCalorieBurn(activity, durationMin, avgHeart);
  const tdee = computeTDEE(state.bodyProfile);
  const proteinG = Math.round(state.bodyProfile.weight * PROTEIN_G_PER_KG[activity]);
  const carbG = Math.round(state.bodyProfile.weight * CARB_G_PER_KG[activity]);

      </div>
      <p class="muted" style="margin:0;">${(last.avgCortisol||0)>=60?'Cortisol clears more slowly than heart rate does — this is factored into your sleep target and readiness score above, even if you feel fine right now.':'Stayed in a manageable range — not a major factor in tonight\'s recovery need.'}</p>

    <div class="label" style="margin-bottom:6px;">How sore are you?</div>

            style="width:64px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; color:var(--text); padding:6px 8px; font-size:14px; text-align:center;">

  recover: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  history: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>',
  settings: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.3-.9-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2 1.6 2 3.4 2.3-.9c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.6z"/></svg>',
};
function render(){
  const showNav = ['live','library','recover','history','settings'].includes(state.screen);
  const screensEl = document.getElementById('screens');
  screensEl.innerHTML = Object.keys(SCREENS).map(key =>
    `<div class="screen ${state.screen===key?'active':''}" data-screen="${key}">${SCREENS[key]()}</div>`
  ).join('');
  const navbarEl = document.getElementById('navbar');
  navbarEl.style.display = showNav ? 'flex' : 'none';
  navbarEl.innerHTML = NAV.map(n => `
    <div class="navitem ${state.screen===n.screen ? 'active':''}" onclick="go('${n.screen}')">
      ${ICONS[n.icon]}<span>${n.label}</span>
    </div>`).join('');
  if(state.screen==='live' && state.session.active) startLiveTimer(); else stopLiveTimer();
  if(state.screen==='scanner' && cameraStream){
    const videoEl = document.getElementById('scannerVideo');
    if(videoEl) videoEl.srcObject = cameraStream;
  }
  if(state.screen!=='scanner' && cameraStream){
    stopCamera();
  }
  saveState();
}

/* =========================================================================
   MODE SWITCH + FIGMA-STYLE FRAME BOARD
========================================================================= */
function setMode(mode){
  document.getElementById('appWrap').classList.toggle('active', mode==='app');
  document.getElementById('boardWrap').classList.toggle('active', mode==='board');
  document.getElementById('modeAppBtn').classList.toggle('active', mode==='app');
  document.getElementById('modeBoardBtn').classList.toggle('active', mode==='board');
  if(mode==='board') renderBoard();
}
const FRAME_ORDER = [
  {key:'consent', title:'Consent'},
  {key:'profile', title:'Your training'},
  {key:'deviceCheck', title:'Device check'},
  {key:'sessionSetup', title:'Start a session'},
  {key:'live', title:'Live — brain & heart'},
  {key:'alertExplain', title:'Risk & recovery'},
  {key:'summary', title:'Session summary'},
  {key:'recover', title:'Recovery & nutrition'},
  {key:'scanner', title:'Food scanner'},
  {key:'scanResult', title:'Scan result & swaps'},
  {key:'library', title:'Workout library'},
  {key:'exerciseDetail', title:'Move detail — why & fix'},
  {key:'history', title:'History'},
  {key:'settings', title:'Settings'},
];
function renderBoard(){
  // build a temporary snapshot state so frames show meaningful demo content
  const snap = JSON.parse(JSON.stringify(state));
  snap.profile.activities = ['bodybuilding','running','yoga','hiit','hybrid'];
  snap.today.activity = 'hiit';
  snap.session = {active:true, paused:false, name:'HIIT', minuteIdx:5};
  snap.alerts = [{id:'demo', ramp:'heart', metricLabel:'Brain load & heart strain', brain:88, heart:90, why:RISK_PROFILE.hiit.why, recs:RISK_PROFILE.hiit.recs, read:true, dismissed:false}];
  snap.activeAlert = 'demo';
  snap.recoveryChecked = {};
  snap.consentGiven = true;
  snap.libraryCat = 'bodybuilding';
  snap.libraryEx = 'concentration-curl';
  snap.soreness = {Chest:'sore', Legs:'mild'};
  snap.sleepHours = 6.5;
  snap.foodCuisine = 'southIndian';
  snap.scannerQuery = 'biryani';
  snap.scannerCuisineFilter = 'all';
  snap.scannerSelected = {cuisineId:'southIndian', foodId:'biryani-south'};
  snap.cameraOn = false;

  const oldState = JSON.stringify(state);
  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, snap);

  const canvas = document.getElementById('boardCanvas');
  canvas.innerHTML = FRAME_ORDER.map((f,i)=>`
    <div class="frame-col">
      <div class="frame">
        <div class="frame-label"><span class="fnum">${String(i+1).padStart(2,'0')}</span> ${f.title}</div>
        <div class="frame-box">
          <div class="fake-status"><span>9:41</span><span>●●● 100%</span></div>
          <div class="screen active">${SCREENS[f.key]()}</div>
        </div>
        ${i<FRAME_ORDER.length-1?'<div class="frame-arrow">→</div>':''}
      </div>
    </div>`).join('');

  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, JSON.parse(oldState));
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if this file isn't hosted alongside — app still works */ });
  });
}
</script>
