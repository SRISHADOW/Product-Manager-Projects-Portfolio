      <div class="metric"><div class="label">Protein target</div><div class="num">${proteinG} g</div></div>
      <div class="metric"><div class="label">Carb target</div><div class="num">${carbG} g</div></div>
    </div>
    <p class="muted" style="margin:8px 0 4px;">Rough estimates from your body profile below and this session's intensity — not a medical or clinical calculation.</p>
    <div class="card" style="margin-bottom:6px;">
      <div class="label" style="margin-bottom:8px;">Your body profile</div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;">
        <label class="label">Weight (kg)<br><input type="number" value="${state.bodyProfile.weight}" onchange="updateBodyProfile('weight',this.value)" style="width:100%; margin-top:4px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; color:var(--text); padding:8px; font-size:13px;"></label>
        <label class="label">Height (cm)<br><input type="number" value="${state.bodyProfile.height}" onchange="updateBodyProfile('height',this.value)" style="width:100%; margin-top:4px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; color:var(--text); padding:8px; font-size:13px;"></label>
        <label class="label">Age<br><input type="number" value="${state.bodyProfile.age}" onchange="updateBodyProfile('age',this.value)" style="width:100%; margin-top:4px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; color:var(--text); padding:8px; font-size:13px;"></label>
        <label class="label">Sex<br>
          <select onchange="updateBodyProfile('sex',this.value)" style="width:100%; margin-top:4px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; color:var(--text); padding:8px; font-size:13px;">
            <option value="male" ${state.bodyProfile.sex==='male'?'selected':''}>Male</option>
            <option value="female" ${state.bodyProfile.sex==='female'?'selected':''}>Female</option>
          </select>
        </label>
      </div>
      <label class="label">Daily activity outside training<br>
        <select onchange="updateBodyProfile('activityLevel',this.value)" style="width:100%; margin-top:4px; background:var(--surface-2); border:1px solid var(--border-strong); border-radius:8px; color:var(--text); padding:8px; font-size:13px;">
          <option value="sedentary" ${state.bodyProfile.activityLevel==='sedentary'?'selected':''}>Mostly sitting</option>
          <option value="light" ${state.bodyProfile.activityLevel==='light'?'selected':''}>Lightly active</option>
          <option value="moderate" ${state.bodyProfile.activityLevel==='moderate'?'selected':''}>Moderately active</option>
          <option value="active" ${state.bodyProfile.activityLevel==='active'?'selected':''}>Active</option>
          <option value="veryactive" ${state.bodyProfile.activityLevel==='veryactive'?'selected':''}>Very active</option>
        </select>
      </label>
    </div>

    <div class="label" style="margin:14px 0 6px;">Everyday food ideas</div>
    <div class="card" style="margin-bottom:6px;">
      <div class="label" style="margin-bottom:6px; color:var(--brain);">Protein</div>
      <div class="chip-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:12px;">${FOOD_LIBRARY.protein.map(f=>`<div class="chip">${f}</div>`).join('')}</div>
      <div class="label" style="margin-bottom:6px; color:var(--amber);">Carbohydrates</div>
      <div class="chip-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:12px;">${FOOD_LIBRARY.carbs.map(f=>`<div class="chip">${f}</div>`).join('')}</div>
      <div class="label" style="margin-bottom:6px; color:var(--blue);">Hydration</div>
      <div class="chip-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:12px;">${FOOD_LIBRARY.hydration.map(f=>`<div class="chip">${f}</div>`).join('')}</div>
      <div class="label" style="margin-bottom:6px; color:var(--heart);">Healthy fats</div>
      <div class="chip-grid" style="grid-template-columns:repeat(2,1fr);">${FOOD_LIBRARY.fats.map(f=>`<div class="chip">${f}</div>`).join('')}</div>
    </div>

    <div class="card" style="cursor:pointer; margin-bottom:14px; background:var(--teal-dim); border-color:transparent;" onclick="openScanner()">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><div style="font-size:13px; font-weight:600; color:var(--teal);">📷 Scan a food</div><div class="label">Check if it fits, and find affordable swaps if it doesn't</div></div>
        <span style="color:var(--teal);">›</span>
      </div>
    </div>

    <div class="label" style="margin:14px 0 6px;">Real meals, right portions</div>
    <p class="muted" style="margin-top:0; margin-bottom:10px;">Yes, biryani (or pizza, or butter chicken) can absolutely be part of this — the portion just needs to match your body and today's training, not be skipped.</p>
    <div class="chip-grid" style="grid-template-columns:repeat(2,1fr); margin-bottom:12px;">
      ${FOOD_CUISINES.map(c=>`<div class="chip ${state.foodCuisine===c.id?'on':''}" onclick="setFoodCuisine('${c.id}')">${c.emoji} ${c.name}</div>`).join('')}
    </div>
    ${FOOD_DISHES[state.foodCuisine].map(dish=>{
      const portion = computeDishPortion(dish, {proteinG, carbG}, tdee);
      const fit = fitLabel(portion.scale);
      const scaleText = portion.scale<1 ? `~${Math.round(portion.scale*100)}% of` : `~${portion.scale.toFixed(1)}×`;
      return `
      <div class="card" style="margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:6px;">
          <div>
            <div style="font-size:13.5px; font-weight:600;">${dish.name}</div>
            <div class="label" style="margin-top:2px;">Typical serving: ${dish.serving.desc}</div>
          </div>
          <span class="pill ${fit.cls}">${fit.text}</span>
        </div>
        <div style="font-size:14px; font-weight:600; margin-bottom:2px;">Your portion: ~${portion.grams}g <span class="label" style="font-weight:400;">(${scaleText} a typical serving)</span></div>
        <div class="label" style="margin-bottom:8px;">${portion.kcal} kcal · P ${portion.protein}g · C ${portion.carb}g · F ${portion.fat}g</div>
        <div class="muted" style="margin:0;">${dish.note}</div>
      </div>`;
    }).join('')}
    <p class="muted" style="font-size:11px; margin-top:10px;">General nutrition education, not a personalized diet or medical plan. If you have a health condition, allergy, or specific goal, a registered dietitian or doctor can tailor this properly for you.</p>`;
}

function screenSettings(){
  const labelFor = s=>({connected:'Connected', weak:'Weak signal', disconnected:'Disconnected'}[s]);
  return `
    <div class="topbar"><h2>Settings</h2></div>
    <div class="label" style="margin-bottom:6px;">Devices</div>
    <div class="card" style="margin-bottom:16px;">
      ${state.devices.map(d=>`<div class="row-line"><div style="display:flex; align-items:center; gap:10px;"><div class="dot ${d.status==='connected'?'teal':d.status==='weak'?'amber':'heart'}"></div><div style="font-size:13px;">${d.name}</div></div><span class="label">${labelFor(d.status)}</span></div>`).join('')}
    </div>
    <div class="label" style="margin-bottom:6px;">Your activities</div>
    <div class="chip-grid" style="margin-bottom:16px;">
      ${ACTIVITIES.map(a=>`<div class="chip ${state.profile.activities.includes(a.id)?'on':''}" onclick="toggleActivity('${a.id}')">${a.emoji} ${a.name}</div>`).join('')}
    </div>
    <div class="label" style="margin-bottom:6px;">Weekly goal</div>
    <div class="chip-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:16px;">
      ${[2,3,4,5].map(n=>`<div class="chip ${state.profile.frequency===n?'on':''}" onclick="setFrequency(${n})">${n}${n===5?'+':''}x</div>`).join('')}
    </div>
    <div class="label" style="margin-bottom:6px;">Data</div>
    <div class="card"><div class="row-line"><div style="font-size:13px;">Stored on this device only</div><span class="pill teal">Private</span></div></div>`;
}

/* =========================================================================
   RENDER
========================================================================= */
const SCREENS = {
  consent: screenConsent, profile: screenProfile, deviceCheck: screenDeviceCheck,
  sessionSetup: screenSessionSetup, live: screenLive, alertExplain: screenAlertExplain,
  summary: screenSummary, history: screenHistory, library: screenLibrary,
  exerciseDetail: screenExerciseDetail, recover: screenRecover, scanner: screenScanner,
  scanResult: screenScanResult, settings: screenSettings,
};
const NAV = [
  {id:'live', label:'Live', icon:'live', screen:'live'},
  {id:'library', label:'Library', icon:'library', screen:'library'},
  {id:'recover', label:'Recover', icon:'recover', screen:'recover'},
  {id:'history', label:'History', icon:'history', screen:'history'},
  {id:'settings', label:'Settings', icon:'settings', screen:'settings'},
];
const ICONS = {
  live: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>',
  library: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19a2.5 2.5 0 0 1 2.5-2.5H20"/></svg>',
  recover: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg>',
  history: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>',
  settings: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.3-.9-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2 1.6 2 3.4 2.3-.9c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.6z"/></svg>',
};
function render(){
  const showNav = ['live','library','recover','history','settings'].includes(state.screen);
  const screensEl = document.getElementById('screens');
  screensEl.innerHTML = Object.keys(SCREENS).map(key =>
    `<div class="screen ${state.screen===key?'active':''}" data-screen="${key}">${SCREENS[key]()}</div>`
  ).join('');
  const navbarEl = document.getElementById('navbar');
  navbarEl.style.display = showNav ? 'flex' : 'none';
  navbarEl.innerHTML = NAV.map(n => `
    <div class="navitem ${state.screen===n.screen ? 'active':''}" onclick="go('${n.screen}')">
      ${ICONS[n.icon]}<span>${n.label}</span>
    </div>`).join('');
  if(state.screen==='live' && state.session.active) startLiveTimer(); else stopLiveTimer();
  if(state.screen==='scanner' && cameraStream){
    const videoEl = document.getElementById('scannerVideo');
    if(videoEl) videoEl.srcObject = cameraStream;
  }
  if(state.screen!=='scanner' && cameraStream){
    stopCamera();
  }
}

/* =========================================================================
   MODE SWITCH + FIGMA-STYLE FRAME BOARD
========================================================================= */
function setMode(mode){
  document.getElementById('appWrap').classList.toggle('active', mode==='app');
  document.getElementById('boardWrap').classList.toggle('active', mode==='board');
  document.getElementById('modeAppBtn').classList.toggle('active', mode==='app');
  document.getElementById('modeBoardBtn').classList.toggle('active', mode==='board');
  if(mode==='board') renderBoard();
}
const FRAME_ORDER = [
  {key:'consent', title:'Consent'},
  {key:'profile', title:'Your training'},
  {key:'deviceCheck', title:'Device check'},
  {key:'sessionSetup', title:'Start a session'},
  {key:'live', title:'Live — brain & heart'},
  {key:'alertExplain', title:'Risk & recovery'},
  {key:'summary', title:'Session summary'},
  {key:'recover', title:'Recovery & nutrition'},
  {key:'scanner', title:'Food scanner'},
  {key:'scanResult', title:'Scan result & swaps'},
  {key:'library', title:'Workout library'},
  {key:'exerciseDetail', title:'Move detail — why & fix'},
  {key:'history', title:'History'},
  {key:'settings', title:'Settings'},
];
function renderBoard(){
  // build a temporary snapshot state so frames show meaningful demo content
  const snap = JSON.parse(JSON.stringify(state));
  snap.profile.activities = ['bodybuilding','running','yoga','hiit','hybrid'];
  snap.today.activity = 'hiit';
  snap.session = {active:true, paused:false, name:'HIIT', minuteIdx:5};
  snap.alerts = [{id:'demo', ramp:'heart', metricLabel:'Brain load & heart strain', brain:88, heart:90, why:RISK_PROFILE.hiit.why, recs:RISK_PROFILE.hiit.recs, read:true, dismissed:false}];
  snap.activeAlert = 'demo';
  snap.recoveryChecked = {};
  snap.consentGiven = true;
  snap.libraryCat = 'bodybuilding';
  snap.libraryEx = 'concentration-curl';
  snap.soreness = {Chest:'sore', Legs:'mild'};
  snap.sleepHours = 6.5;
  snap.foodCuisine = 'southIndian';
  snap.scannerQuery = 'biryani';
  snap.scannerCuisineFilter = 'all';
  snap.scannerSelected = {cuisineId:'southIndian', foodId:'biryani-south'};
  snap.cameraOn = false;

  const oldState = JSON.stringify(state);
  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, snap);

  const canvas = document.getElementById('boardCanvas');
  canvas.innerHTML = FRAME_ORDER.map((f,i)=>`
    <div class="frame-col">
      <div class="frame">
        <div class="frame-label"><span class="fnum">${String(i+1).padStart(2,'0')}</span> ${f.title}</div>
        <div class="frame-box">
          <div class="fake-status"><span>9:41</span><span>●●● 100%</span></div>
          <div class="screen active">${SCREENS[f.key]()}</div>
        </div>
        ${i<FRAME_ORDER.length-1?'<div class="frame-arrow">→</div>':''}
      </div>
    </div>`).join('');

  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, JSON.parse(oldState));
}

render();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* fine if this file isn't hosted alongside — app still works */ });
  });
}
</script>
</body>
</html>
