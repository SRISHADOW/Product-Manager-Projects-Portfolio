<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuroPulse Fit — Brain &amp; Heart coach for your training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A100C; --surface:#131B16; --surface-2:#1B2620; --surface-3:#233028;
    --border:rgba(255,255,255,0.08); --border-strong:rgba(255,255,255,0.16);
    --text:#EAF1EC; --text-dim:#95A69C; --text-faint:#5A6B61;
    --teal:#33C793; --teal-dim:rgba(51,199,147,0.14);
    --brain:#9B87F5; --brain-dim:rgba(155,135,245,0.15);
    --heart:#F2637A; --heart-dim:rgba(242,99,122,0.15);
    --amber:#E3A23C; --amber-dim:rgba(227,162,60,0.15);
    --blue:#5B9FE0; --blue-dim:rgba(91,159,224,0.15);
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh; min-height:100dvh;
    background:radial-gradient(circle at 18% 0%, #101c15 0%, var(--bg) 55%);
    font-family:'Inter',sans-serif; color:var(--text);
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  h1,h2,h3,.num,.brand{font-family:'Space Grotesk',sans-serif;}
  .num{font-variant-numeric:tabular-nums;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{background:var(--teal-dim);}

  /* ---------------- top-level mode switch ---------------- */
  .modebar{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; gap:4px; background:var(--surface); border:1px solid var(--border-strong);
    border-radius:100px; padding:4px; box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  .modebar button{
    border:none; background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:500;
    padding:8px 16px; border-radius:100px; transition:.15s;
  }
  .modebar button.active{background:var(--teal); color:#04241a;}

  /* ================= APP (phone / dashboard) ================= */
  .app-wrap{display:none; width:100%; height:100%; align-items:center; justify-content:center;}
  .app-wrap.active{display:flex;}

  .phone{
    width:100%; max-width:400px; height:calc(100vh - 24px); height:calc(100dvh - 24px); max-height:840px;
    background:var(--bg); border-radius:30px;
    border:1px solid var(--border-strong); position:relative; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    display:flex; flex-direction:column;
  }
  @media (min-width:480px){ .phone{ border-radius:44px; } }
  .statusbar{
    display:flex; justify-content:space-between; padding:16px 26px 6px;
    font-size:13px; color:var(--text-dim); flex-shrink:0;
  }
  .screens{flex:1; position:relative; overflow:hidden;}
  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:8px 20px 0; overflow-y:auto; opacity:0; pointer-events:none;
    transition:opacity .18s ease;
  }
  .screen.active{opacity:1; pointer-events:auto;}
  .screen::-webkit-scrollbar{display:none;}

  .topbar{display:flex; align-items:center; gap:10px; padding:6px 0 16px; flex-shrink:0;}
  .topbar h2{font-size:17px; font-weight:600; margin:0; flex:1; padding-right:30px;}
  .back{width:28px; height:28px; border-radius:50%; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--text-dim); font-size:14px; flex-shrink:0;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .btn{
    border-radius:11px; border:1px solid var(--border-strong); background:var(--surface-2);
    color:var(--text); padding:13px 18px; font-size:14px; font-weight:500; text-align:center;
    transition:background .15s, opacity .15s;
  }
  .btn:active{opacity:0.7;}
  .btn.primary{background:var(--teal); color:#04241a; border-color:var(--teal);}
  .btn.ghost{background:transparent; border-color:var(--border);}
  .btn.block{width:100%; display:block;}
  .btn[disabled]{opacity:0.35; pointer-events:none;}
  .btn-row{display:flex; gap:10px; margin-top:auto; padding:16px 0 22px;}

  .label{font-size:11.5px; color:var(--text-faint); letter-spacing:.01em;}
  .muted{color:var(--text-dim); font-size:13px; line-height:1.5;}

  .pill{font-size:11px; padding:3px 10px; border-radius:20px; font-weight:500; display:inline-block;}
  .pill.teal{background:var(--teal-dim); color:var(--teal);}
  .pill.amber{background:var(--amber-dim); color:var(--amber);}
  .pill.heart{background:var(--heart-dim); color:var(--heart);}
  .pill.brain{background:var(--brain-dim); color:var(--brain);}
  .pill.blue{background:var(--blue-dim); color:var(--blue);}

  .chip{border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px; font-size:13px; text-align:center; background:var(--surface-2); color:var(--text-dim);}
  .chip.on{background:var(--teal-dim); border-color:var(--teal); color:var(--teal);}
  .chip-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}

  .toggle{width:42px; height:24px; border-radius:14px; background:var(--surface-2); border:1px solid var(--border-strong); position:relative; flex-shrink:0;}
  .toggle .knob{width:18px; height:18px; border-radius:50%; background:var(--text-faint); position:absolute; top:2px; left:2px; transition:.15s;}
  .toggle.on{background:var(--teal-dim); border-color:var(--teal);}
  .toggle.on .knob{left:21px; background:var(--teal);}

  .row-line{display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border);}
  .row-line:last-child{border-bottom:none;}
  .dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .dot.teal{background:var(--teal);} .dot.amber{background:var(--amber);} .dot.heart{background:var(--heart);} .dot.brain{background:var(--brain);}

  /* --- stage banner --- */
  .stage-banner{border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:12px;}
  .stage-banner.warmup{background:var(--surface-2); border:1px solid var(--border-strong);}
  .stage-banner.optimal{background:var(--teal-dim); border:1px solid transparent;}
  .stage-banner.effort{background:var(--amber-dim); border:1px solid transparent;}
  .stage-banner.risk{background:var(--heart-dim); border:1px solid transparent;}
  .stage-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .stage-banner.warmup .stage-dot{background:var(--text-dim);}
  .stage-banner.optimal .stage-dot{background:var(--teal); box-shadow:0 0 0 4px var(--teal-dim);}
  .stage-banner.effort .stage-dot{background:var(--amber); box-shadow:0 0 0 4px var(--amber-dim);}
  .stage-banner.risk .stage-dot{background:var(--heart); box-shadow:0 0 0 4px var(--heart-dim);}
  .stage-banner .stage-title{font-weight:600; font-size:14px;}
  .stage-banner .stage-sub{font-size:11.5px; color:var(--text-dim); margin-top:1px;}

  /* --- gauges --- */
  .gauge-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .gauge{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px;}
  .gauge .g-head{display:flex; align-items:center; gap:6px; margin-bottom:8px;}
  .gauge .g-head .g-dot{width:7px; height:7px; border-radius:50%;}
  .gauge.brain .g-head .g-dot{background:var(--brain);}
  .gauge.heart .g-head .g-dot{background:var(--heart);}
  .gauge .g-label{font-size:11.5px; color:var(--text-dim); font-weight:500;}
  .gauge .g-num{font-size:26px; font-weight:600; line-height:1;}
  .gauge .g-status{font-size:11px; margin-top:3px;}
  .g-bar{height:6px; border-radius:4px; background:var(--surface-3); margin-top:9px; overflow:hidden;}
  .g-bar .fill{height:100%; border-radius:4px; transition:width .5s ease;}
  .gauge.brain .g-bar .fill{background:var(--brain);}
  .gauge.heart .g-bar .fill{background:var(--heart);}

  .metric-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .metric{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px;}
  .metric .num{font-size:20px; font-weight:600; margin-top:2px;}

  .signal-card{margin-bottom:14px; cursor:pointer;}
  .alert-item{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; border-radius:11px; padding:11px 12px; font-size:12.5px; margin-bottom:8px; cursor:pointer;}
  .alert-item.amber{background:var(--amber-dim); color:#f0c589;}
  .alert-item.heart{background:var(--heart-dim); color:#f6a3b1;}
  .alert-item.brain{background:var(--brain-dim); color:#c6bafb;}
  .alert-item .x{opacity:.7; font-size:13px; flex-shrink:0;}
  .banner{background:var(--heart-dim); color:var(--heart); font-size:12px; padding:9px 12px; border-radius:10px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}

  .recovery-item{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .recovery-item:last-child{border-bottom:none;}
  .check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border-strong); flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center; font-size:12px; color:transparent;}
  .check.done{background:var(--teal); border-color:var(--teal); color:#04241a;}

  .navbar{display:flex; justify-content:space-around; padding:10px 0 20px; border-top:1px solid var(--border); background:var(--bg); flex-shrink:0;}
  .navitem{display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:9.5px; width:60px;}
  .navitem.active{color:var(--teal);}
  .navicon{width:20px; height:20px;}

  .stat-row{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .stat-row:last-child{border-bottom:none;}
  .zonebar{display:flex; height:14px; border-radius:8px; overflow:hidden; margin:10px 0 6px;}
  .zonebar span{height:100%;}
  .zonekey{display:flex; gap:12px; flex-wrap:wrap; font-size:10.5px; color:var(--text-dim);}
  .zonekey .k{display:flex; align-items:center; gap:5px;}
  .zonekey .sw{width:8px; height:8px; border-radius:2px;}

  .empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; margin:auto; padding:40px 10px; color:var(--text-dim);}

  .toast{
    position:absolute; bottom:90px; left:20px; right:20px; background:var(--surface-2);
    border:1px solid var(--border-strong); border-radius:10px; padding:10px 14px; font-size:12.5px;
    opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; z-index:5;
  }
  .toast.show{opacity:1; transform:translateY(0);}

  .weekgoal{display:flex; gap:6px; margin-top:8px;}
  .weekgoal .d{flex:1; height:6px; border-radius:4px; background:var(--surface-3);}
  .weekgoal .d.on{background:var(--teal);}

  /* ================= DESKTOP DASHBOARD LAYOUT ================= */
  @media (min-width:900px){
    .app-wrap.active{align-items:stretch; justify-content:stretch;}
    .phone{
      max-width:1180px; width:94vw; height:88vh; max-height:800px; margin:auto;
      border-radius:22px; flex-direction:row;
    }
    .statusbar{display:none;}
    .navbar{
      order:-1; flex-direction:column; justify-content:flex-start; align-items:center;
      gap:26px; width:92px; padding:32px 0; border-top:none; border-right:1px solid var(--border);
      flex-shrink:0;
    }
    .navitem{width:auto;}
    .navitem span{display:none;}
    .navicon{width:22px; height:22px;}
    .screens{padding:0;}
    .screen{padding:34px 44px 0; max-width:820px; margin:0 auto;}
    .gauge-grid, .metric-grid{grid-template-columns:repeat(4,1fr);}
    .chip-grid{grid-template-columns:repeat(3,1fr);}
    .btn-row{padding-bottom:34px;}
    .topbar h2{font-size:22px;}
  }

  /* ================= FIGMA-STYLE FRAME OVERVIEW ================= */
  .board-wrap{display:none; width:100%; height:100%; overflow:auto; padding:76px 24px 40px;}
  .board-wrap.active{display:block;}
  .board-canvas{
    min-width:max-content; display:flex; gap:56px; padding:20px;
    background-image:radial-gradient(circle, rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size:22px 22px;
  }
  .frame-col{display:flex; flex-direction:column; gap:40px;}
  .frame{position:relative;}
  .frame-label{font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:var(--text-dim); margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .frame-label .fnum{color:var(--text-faint); font-variant-numeric:tabular-nums;}
  .frame-box{
    width:280px; height:572px; background:var(--bg); border-radius:22px; border:1px solid var(--border-strong);
    overflow:hidden; position:relative; box-shadow:0 12px 30px rgba(0,0,0,.4);
  }
  .frame-box .screen{position:static; opacity:1; padding:6px 16px 0; transform:scale(.82); transform-origin:top left; width:341px; height:697px; overflow:hidden; pointer-events:none;}
  .frame-box .fake-status{display:flex; justify-content:space-between; padding:14px 22px 4px; font-size:12px; color:var(--text-dim);}
  .frame-arrow{position:absolute; top:50%; right:-44px; transform:translateY(-50%); color:var(--text-faint); font-size:20px;}
  .board-title{color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:20px; margin:0 0 4px; padding:0 24px;}
  .board-sub{color:var(--text-dim); font-size:13px; margin:0 0 18px; padding:0 24px; max-width:640px;}
</style>
</head>
<body>

<div class="modebar">
  <button id="modeAppBtn" class="active" onclick="setMode('app')">Live app</button>
  <button id="modeBoardBtn" onclick="setMode('board')">Frame overview</button>
</div>

<!-- ===================== LIVE APP ===================== -->
<div class="app-wrap active" id="appWrap">
  <div class="phone" id="phone">
    <div class="statusbar"><span>9:41</span><span>●●● 100%</span></div>
    <div class="screens" id="screens"></div>
    <div class="navbar" id="navbar"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<!-- ===================== FIGMA-STYLE FRAME OVERVIEW ===================== -->
<div class="board-wrap" id="boardWrap">
  <h1 class="board-title">NeuroPulse Fit — UX flow</h1>
  <p class="board-sub">Every screen in the product, laid out in the order a person moves through them: onboarding → device check → live training → risk &amp; recovery → summary → history. Switch to "Live app" to interact with it.</p>
  <div class="board-canvas" id="boardCanvas"></div>
</div>

<script>
/* =========================================================================
   DATA MODEL
========================================================================= */
const ACTIVITIES = [
  {id:'bodybuilding', name:'Bodybuilding', hint:'Strength / hypertrophy'},
  {id:'running',      name:'Running',      hint:'Steady-state / intervals'},
  {id:'yoga',         name:'Yoga',         hint:'Mobility / breathwork'},
  {id:'hiit',         name:'HIIT',         hint:'High-intensity intervals'},
  {id:'general',      name:'General training', hint:'Mixed / gym session'},
];

const RECOVERY_LIBRARY = {
  breathing:{title:'Box breathing reset', detail:'Inhale 4s · hold 4s · exhale 4s · hold 4s, repeat for 90 seconds.'},
  hydrate:{title:'Hydrate', detail:'Sip 200–300ml of water before continuing.'},
  dropload:{title:'Drop intensity one level', detail:'Reduce pace, weight, or tempo for the next block.'},
  extendrest:{title:'Extend rest between sets', detail:'Add 30–45s of rest before the next set or interval.'},
  formcheck:{title:'Reset your form', detail:'Slow the next rep down and check bar path / posture before continuing.'},
  stopcooldown:{title:'End the set and cool down', detail:'Stop this block, walk it out, and let heart rate settle below 120bpm.'},
  stretch:{title:'Move into stillness', detail:'Come out of the pose, sit, and take 5 slow breaths before continuing.'},
};

const STAGE_META = {
  warmup:{label:'Warm-up',            cls:'warmup',  sub:'Building into the session — nothing to act on yet.'},
  optimal:{label:'Optimal / Flow',    cls:'optimal', sub:'Brain and heart signals are within your normal working range.'},
  effort:{label:'High effort',        cls:'effort',  sub:'Working hard — worth watching, not yet a concern.'},
  risk:{label:'Overreaching — risk',  cls:'risk',    sub:'Signals suggest strain building faster than your baseline recovers from.'},
};

/* per-activity scripted demo timeline: [minute, brain(0-100 stress/load), heart(0-100 strain)] */
const TIMELINES = {
  bodybuilding: [[0,22,18],[2,34,30],[4,46,42],[6,58,55],[8,71,64],[10,83,74],[12,88,80],[14,74,60],[16,55,44]],
  running:      [[0,20,24],[2,32,38],[4,44,52],[6,55,63],[8,66,74],[10,78,86],[12,86,92],[14,70,68],[16,52,50]],
  yoga:         [[0,40,14],[2,32,16],[4,26,15],[6,22,14],[8,30,20],[10,58,34],[12,70,40],[14,42,22],[16,26,16]],
  hiit:         [[0,26,20],[2,44,40],[4,62,58],[6,78,74],[8,90,88],[10,94,95],[12,80,72],[14,60,52],[16,40,34]],
  general:      [[0,24,20],[2,38,34],[4,50,46],[6,60,56],[8,68,64],[10,60,54],[12,52,46],[14,40,36],[16,30,26]],
};

const RISK_PROFILE = {
  bodybuilding:{trigger:'brain', why:'Cognitive load is climbing faster than load usually does at this stage of a strength session — often a sign of fatiguing form control before the muscle itself is done.', recs:['formcheck','extendrest','hydrate']},
  running:     {trigger:'heart', why:'Cardiac strain has crossed your personal threshold for sustained pace — heart rate is rising without pace increasing, a classic cardiac-drift warning.', recs:['dropload','hydrate','breathing']},
  yoga:        {trigger:'heart', why:'Heart strain is unusually high for a low-exertion pose — often linked to breath-holding or overreaching a stretch rather than physical effort.', recs:['stretch','breathing']},
  hiit:        {trigger:'both', why:'Both brain load and cardiac strain are elevated together — the combination most associated with overreaching in interval training.', recs:['stopcooldown','breathing','hydrate']},
  general:     {trigger:'heart', why:'Heart strain is trending above your baseline for this kind of session.', recs:['dropload','extendrest','hydrate']},
};

/* ---- exercise / position library, per category ----
   Each entry explains the brain+heart mechanism behind why it "works" (the
   pump / the flow / the burn), what it looks like when it's NOT working,
   why that happens, and how to fix it. */
const EXERCISE_LIBRARY = {
  bodybuilding:[
    {id:'incline-curl', name:'Incline dumbbell curl', tag:'Biceps — long head',
     brainRole:'Mind-muscle focus on the stretch position recruits more motor units in the long head, which sits on the outside of the arm.',
     heartRole:'Short sets and short rest keep local blood flow trapped in the muscle — that trapped blood (not heart rate) is most of what you feel as "the pump".',
     problem:{title:'Feels like a stretch but no pump', why:'Usually the elbow drifts forward, taking tension off the long head, or rest between sets is too long and the blood pools out before the next set.'},
     solution:['Keep the elbow pinned slightly behind the torso through the whole rep','Cap rest at 45–60s for pump-focused sets','Slow the eccentric to 2–3s to hold tension at the stretch']},
    {id:'concentration-curl', name:'Concentration curl', tag:'Biceps — short head (peak)',
     brainRole:'Isolating the arm and watching it strengthens the mind-muscle connection, which increases short-head recruitment more than any other curl variation.',
     heartRole:'Heart rate rises only moderately here — the burn is metabolic (local), not cardiovascular, so a high heart rate is not the goal for this move.',
     problem:{title:'Peak not showing up', why:'Momentum from the shoulder or torso is doing part of the lift, so the short head never reaches full contraction.'},
     solution:['Brace your elbow against your inner thigh so only the forearm moves','Squeeze and hold 1s at the top before lowering','Drop the weight 10–15% and rebuild strict form first']},
    {id:'incline-bench', name:'Incline barbell press', tag:'Chest — upper',
     brainRole:'Cueing "push through the upper chest" before the set shifts motor-unit recruitment upward and improves bar path consistency.',
     heartRole:'Heavy compound pressing spikes heart rate fast — strain here is normal and expected, unlike an isolation curl.',
     problem:{title:'Shoulders doing the work, chest feels flat', why:'Bench angle is too steep (above ~30°) or the shoulder blades aren\'t retracted, so delts take over the movement.'},
     solution:['Drop the bench to 15–30°','Pin your shoulder blades back and down before unracking','Lower the bar to the upper chest, not the collarbone']},
    {id:'weighted-dips', name:'Weighted dips', tag:'Chest — lower / triceps',
     brainRole:'Leaning the torso forward shifts brain-driven recruitment toward the lower chest fibers instead of the triceps.',
     heartRole:'A compound push under load with added weight drives heart strain up quickly — this is one of the higher cardiac-load bodybuilding moves.',
     problem:{title:'Shoulders feel the strain, not the chest', why:'Staying too upright turns the dip into a triceps-dominant, shoulder-loading movement.'},
     solution:['Lean forward ~30° and let the elbows flare slightly','Stop at the point where shoulders are level with elbows','Reduce added weight until the lean can be held with control']},
    {id:'wide-pullup', name:'Wide-grip pull-up', tag:'Back — width (lats)',
     brainRole:'Thinking "elbows to hips" instead of "hands to bar" redirects brain-driven effort into the lats rather than the arms.',
     heartRole:'A demanding bodyweight compound pull — expect heart rate to climb close to your interval-training range by the last few reps.',
     problem:{title:'Arms give out before the back does', why:'Grip and biceps are doing most of the pulling because the shoulder blades never depress and retract first.'},
     solution:['Start every rep by pulling the shoulder blades down and back','Use a slightly wider-than-shoulder grip, not maximal width','Add a 1s pause at the top to confirm the lats, not the arms, are working']},
    {id:'barbell-row', name:'Barbell row', tag:'Back — thickness',
     brainRole:'A flat, braced spine lets the brain recruit the mid-back cleanly; a rounded back reroutes effort into the lower back and grip.',
     heartRole:'Heart strain builds steadily across a set as the isometric hold on the spine adds to the pulling effort.',
     problem:{title:'Lower back tightens up instead of the back pumping', why:'The torso is rowing from the hips each rep (using momentum) rather than staying fixed while the arms pull.'},
     solution:['Brace your core and fix your torso angle before the first rep','Pull to the lower ribs, not the chest','Drop the weight until the torso can stay still for every rep']},
    {id:'overhead-ext', name:'Overhead triceps extension', tag:'Triceps — long head',
     brainRole:'Keeping the upper arm pinned by the ear and focusing on the stretch overhead biases the long head, the only triceps head that crosses the shoulder.',
     heartRole:'Low systemic demand — heart rate barely moves, so if you feel breathless here the load or the rest period is off.',

function statusFor(v){ return v<35?'Calm':v<60?'Elevated':v<80?'High':'Critical'; }
function stageFor(brain,heart,minute){
  if(minute<=1) return 'warmup';
  const idx = brain*0.5+heart*0.5;
  if(idx>=78) return 'risk';
  if(idx>=55) return 'effort';
  return 'optimal';
}

/* ---------------- creative chart helpers (pure SVG, no library) ---------------- */
const JS_COLORS = {brain:'#9B87F5', heart:'#F2637A', teal:'#33C793', amber:'#E3A23C'};

function hashSeed(str){ let h=0; for(let i=0;i<str.length;i++){ h = Math.imul(31,h) + str.charCodeAt(i) | 0; } return Math.abs(h); }
function seededCurve(seed, n){
  const arr = [];
  for(let i=0;i<n;i++){
    let x = Math.sin(seed*0.017 + i*12.9898) * 43758.5453;
    x = x - Math.floor(x);
    arr.push(Math.round(18 + x*72));
  }
  return arr;
}
function sparkPathFromValues(values, w, h){
  const n = values.length-1;
  return values.map((v,i)=>`${((i/n)*w).toFixed(1)},${(h-(v/100)*h).toFixed(1)}`).join(' ');
}

function svgRadar(labels, values, colorHex, size){
  size = size||190;
  const n = labels.length, cx=size/2, cy=size/2, r=size/2-30;
  const ptAt = (i,frac)=>{ const a=(Math.PI*2*i/n)-Math.PI/2; return [cx+r*frac*Math.cos(a), cy+r*frac*Math.sin(a)]; };
  const rings = [0.33,0.66,1].map(f=>`<polygon points="${labels.map((_,i)=>ptAt(i,f).join(',')).join(' ')}" fill="none" stroke="var(--border)" stroke-width="1"/>`).join('');
  const spokes = labels.map((_,i)=>{ const p=ptAt(i,1); return `<line x1="${cx}" y1="${cy}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`; }).join('');
  const poly = values.map((v,i)=>ptAt(i,Math.max(0.06,v/100)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const labelEls = labels.map((l,i)=>{ const p=ptAt(i,1.22); return `<text x="${p[0].toFixed(1)}" y="${p[1].toFixed(1)}" font-size="9.5" fill="var(--text-dim)" text-anchor="middle" dominant-baseline="middle" font-family="Inter">${l}</text>`; }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}${spokes}<polygon points="${poly}" fill="${colorHex}33" stroke="${colorHex}" stroke-width="2"/>${labelEls}</svg>`;
}
function svgRing(percent, colorHex, size, label){
  size = size||128; const strokeW=11; const r=size/2-strokeW;
  const c=2*Math.PI*r; const dash=c*(Math.max(0,Math.min(100,percent))/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="${strokeW}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${colorHex}" stroke-width="${strokeW}" stroke-linecap="round" stroke-dasharray="${dash.toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="${size/2}" y="${size/2+3}" font-size="21" font-weight="600" fill="var(--text)" text-anchor="middle" font-family="Space Grotesk">${Math.round(percent)}%</text>
    ${label?`<text x="${size/2}" y="${size/2+19}" font-size="9" fill="var(--text-faint)" text-anchor="middle" font-family="Inter">${label}</text>`:''}
  </svg>`;
}
function svgDecayBars(values, colorHex){
  const w=280,h=92; const gap=w/values.length; const bw=gap*0.56;
  const bars = values.map((v,i)=>{ const bh=(v/100)*h; const x=i*gap+(gap-bw)/2; const op=(0.4+0.6*(v/100)).toFixed(2);
    return `<rect x="${x.toFixed(1)}" y="${(h-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${colorHex}" opacity="${op}"/>`; }).join('');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">${bars}<line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="var(--border)" stroke-width="1"/></svg>`;
}
function svgDualLine(splits){
  const w=280,h=92,n=splits.length;
  const paces = splits.map(s=>s.pace); const maxP=Math.max(...paces), minP=Math.min(...paces);
  const hrPts = splits.map((s,i)=>`${((i/(n-1))*w).toFixed(1)},${(h-(s.hr/100)*h).toFixed(1)}`).join(' ');
  const pacePts = splits.map((s,i)=>{ const norm = maxP===minP?0.5:(s.pace-minP)/(maxP-minP); const y = h*0.12 + (1-norm)*h*0.76; return `${((i/(n-1))*w).toFixed(1)},${y.toFixed(1)}`; }).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${hrPts}" fill="none" stroke="${JS_COLORS.heart}" stroke-width="2.2"/>
    <polyline points="${pacePts}" fill="none" stroke="${JS_COLORS.teal}" stroke-width="2.2" stroke-dasharray="5 4"/>
  </svg>`;
}
function svgDonut(segments, size){
  // segments: [{value, colorHex}], values sum to ~100
  size = size||120; const strokeW=16; const r=size/2-strokeW; const c=2*Math.PI*r;
  let offset=0;
  const arcs = segments.map(seg=>{
    const len = c*(seg.value/100);
    const el = `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${seg.colorHex}" stroke-width="${strokeW}" stroke-dasharray="${len.toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-offset).toFixed(1)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    offset += len; return el;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}</svg>`;
}

/* Build category-specific creative data from a session's timeline */
function buildCategoryExtra(activity, tl){
  const avgBrain = Math.round(tl.reduce((s,r)=>s+r[1],0)/tl.length);
  const avgHeart = Math.round(tl.reduce((s,r)=>s+r[2],0)/tl.length);
  if(activity==='bodybuilding'){
    const base = ['Biceps','Chest','Back','Legs','Shoulders','Triceps'];
    const muscles = {};
    base.forEach((m,i)=>{ muscles[m] = Math.max(20, Math.min(95, Math.round((avgBrain*0.5+avgHeart*0.5) + (seededCurve(hashSeed(m+activity),1)[0]-55)*0.6))); });
    return {muscles};
  }
  if(activity==='running'){
    const splits = tl.map(([m,b,h],i)=>({pace: +(6.2 - (h/100)*1.6).toFixed(2), hr:h}));
    return {splits};
  }
  if(activity==='yoga'){
    const calmScore = Math.max(5, 100-avgHeart);
    return {calmScore};
  }
  if(activity==='hiit'){
    const peak = Math.max(...tl.map(r=>r[2]));
    const intervals = tl.map(([m,b,h])=>Math.round(100 - (peak-h)*0.15 - (h/peak)*10));
    return {intervals:intervals.map(v=>Math.max(35,Math.min(100,v)))};
  }
  // general
  const stages = tl.map(([m,b,h])=>stageFor(b,h,m));
  const counts = {warmup:0,optimal:0,effort:0,risk:0};
  stages.forEach(s=>counts[s]++);
  const total = stages.length;
  return {zones:{warmup:Math.round(counts.warmup/total*100), optimal:Math.round(counts.optimal/total*100), effort:Math.round(counts.effort/total*100), risk:Math.round(counts.risk/total*100)}};
}

function renderCategoryChart(activity, extra){
  if(activity==='bodybuilding'){
    const labels = Object.keys(extra.muscles);
    const values = Object.values(extra.muscles);
    return `<div style="display:flex; flex-direction:column; align-items:center;">
      ${svgRadar(labels, values, JS_COLORS.brain)}
      <p class="muted" style="text-align:center; margin-top:2px;">Pump map — brain+heart engagement by muscle group this session.</p>
    </div>`;
  }
  if(activity==='running'){
    return `${svgDualLine(extra.splits)}
      <div class="zonekey" style="margin-top:6px;"><div class="k"><div class="sw" style="background:${JS_COLORS.heart};"></div>Heart strain</div><div class="k"><div class="sw" style="background:${JS_COLORS.teal};"></div>Pace (dashed, higher = faster)</div></div>`;
  }
  if(activity==='yoga'){
    return `<div style="display:flex; align-items:center; gap:16px;">
      ${svgRing(extra.calmScore, JS_COLORS.teal, 128, 'calm reached')}
      <p class="muted" style="margin:0;">Calm score compares how low your heart strain settled versus the start of the practice. Higher means a deeper parasympathetic shift.</p>
    </div>`;
  }
  if(activity==='hiit'){
    return `${svgDecayBars(extra.intervals, JS_COLORS.amber)}
      <p class="muted" style="margin-top:2px;">Power output per interval — the drop-off shows where nervous-system fatigue set in.</p>`;
  }
  const z = extra.zones;
  return `<div style="display:flex; align-items:center; gap:16px;">
    ${svgDonut([{value:z.optimal,colorHex:JS_COLORS.teal},{value:z.effort,colorHex:JS_COLORS.amber},{value:z.risk,colorHex:JS_COLORS.heart},{value:z.warmup,colorHex:'#3A473F'}], 120)}
    <div class="zonekey" style="flex-direction:column; gap:6px; align-items:flex-start;">
      <div class="k"><div class="sw" style="background:${JS_COLORS.teal};"></div>Optimal ${z.optimal}%</div>
      <div class="k"><div class="sw" style="background:${JS_COLORS.amber};"></div>High effort ${z.effort}%</div>
      <div class="k"><div class="sw" style="background:${JS_COLORS.heart};"></div>Risk ${z.risk}%</div>
      <div class="k"><div class="sw" style="background:#3A473F;"></div>Warm-up ${z.warmup}%</div>
    </div>
  </div>`;
}

    {label:'Sat', activity:'general',      avgBrain:44, avgHeart:40, risk:false, extra:{zones:{warmup:18,optimal:56,effort:21,risk:5}}},
  ],
  eventLog:[],

};

function logEvent(name, detail){ state.eventLog.unshift({name, detail}); }
function go(screen){ state.screen = screen; if(screen!=='live') stopLiveTimer(); render(); }
function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=> t.classList.remove('show'), 1900);
}

========================================================================= */

function screenDeviceCheck(){

function retryDevice(i){ state.devices[i].status='connected'; render(); }

function screenSessionSetup(){
  const acts = ACTIVITIES.filter(a=>state.profile.activities.includes(a.id));
  return `
    <div class="topbar"><h2>Start a session</h2></div>
    <div class="label" style="margin-bottom:8px;">Today I'm training</div>

    </div>`;
}
function startSession(){
  const a = ACTIVITIES.find(a=>a.id===state.today.activity);
  state.session = {active:true, paused:false, name:a.name, minuteIdx:0};
  state.alerts = [];
  state.recoveryChecked = {};
  logEvent('session_started', a.name);
  go('live');
}

function currentReading(){
  const tl = TIMELINES[state.today.activity];
  const i = Math.min(state.session.minuteIdx, tl.length-1);
  const [minute, brain, heart] = tl[i];
  return {minute, brain, heart, isLast:i===tl.length-1};
}

function maybeRaiseAlert(){
  const {brain,heart,minute} = currentReading();
  const stage = stageFor(brain,heart,minute);
  if(stage==='risk' && !state.alerts.some(a=>!a.dismissed)){
    const p = RISK_PROFILE[state.today.activity];
    const id = 'a'+Date.now();
    state.alerts.push({
      id, ramp: p.trigger==='brain'?'brain':'heart',
      metricLabel: p.trigger==='brain'?'Brain load':p.trigger==='heart'?'Heart strain':'Brain load & heart strain',
      brain, heart, why:p.why, recs:p.recs, read:false, dismissed:false,
    });
    logEvent('risk_alert_raised', state.today.activity);
    showToast('New alert — overreaching risk detected');
  }
}

function startLiveTimer(){
  stopLiveTimer();
  state.liveTimer = setInterval(()=>{
    if(!state.session.active || state.session.paused) return;
    const tl = TIMELINES[state.today.activity];
    if(state.session.minuteIdx < tl.length-1) state.session.minuteIdx++;
    maybeRaiseAlert();
    render();
  }, 2200);
}
function stopLiveTimer(){ if(state.liveTimer){ clearInterval(state.liveTimer); state.liveTimer=null; } }

function screenLive(){
  const {brain,heart,minute,isLast} = currentReading();
  const stage = stageFor(brain,heart,minute);
  const meta = STAGE_META[stage];
  const activeAlerts = state.alerts.filter(a=>!a.dismissed);
  return `
    <div class="topbar">
      <h2>${state.session.name || 'Live session'}</h2>
      <button class="btn ghost" style="padding:6px 12px; font-size:12px;" onclick="togglePause()">${state.session.paused?'Resume':'Pause'}</button>
    </div>
    ${state.session.paused?`<div class="banner" style="background:var(--surface-2); color:var(--text-dim);">Paused — signal not updating.</div>`:''}
    <div class="stage-banner ${meta.cls}">
      <div class="stage-dot"></div>
      <div><div class="stage-title">${meta.label}</div><div class="stage-sub">${meta.sub}</div></div>
    </div>
    <div class="gauge-grid">
      <div class="gauge brain">
        <div class="g-head"><div class="g-dot"></div><div class="g-label">Brain level</div></div>
        <div class="g-num">${brain}</div>
        <div class="g-status" style="color:var(--brain);">${statusFor(brain)}</div>
        <div class="g-bar"><div class="fill" style="width:${brain}%;"></div></div>
      </div>
      <div class="gauge heart">
        <div class="g-head"><div class="g-dot"></div><div class="g-label">Heart level</div></div>
        <div class="g-num">${heart}</div>
        <div class="g-status" style="color:var(--heart);">${statusFor(heart)}</div>
        <div class="g-bar"><div class="fill" style="width:${heart}%;"></div></div>
      </div>
    </div>
    <div class="card signal-card">
      <div class="label" style="margin-bottom:6px;">Minute ${minute} · tap to see today's activity</div>
      <svg width="100%" height="42" viewBox="0 0 300 42">
        <polyline points="${sparkPoints(state.today.activity,'brain')}" fill="none" stroke="var(--brain)" stroke-width="2"/>
        <polyline points="${sparkPoints(state.today.activity,'heart')}" fill="none" stroke="var(--heart)" stroke-width="2"/>
      </svg>
    </div>
    <div class="label" style="margin:14px 0 8px;">Alerts</div>
    ${activeAlerts.length===0?`<p class="muted">No active alerts — signals within your normal range.</p>`:activeAlerts.map(a=>`
      <div class="alert-item ${a.ramp}" onclick="openAlert('${a.id}')">
        <span>${a.metricLabel} rising — possible overreaching</span>
        <span class="x" onclick="event.stopPropagation(); dismissAlert('${a.id}')">✕</span>
      </div>`).join('')}
    ${isLast?`<p class="muted" style="margin-top:6px;">End of this session's data.</p>`:''}
    <div class="btn-row" style="padding-top:0;">
      <button class="btn ghost block" onclick="endSession()">End session</button>
    </div>`;
}
function sparkPoints(activity, key){
  const tl = TIMELINES[activity];
  const n = tl.length-1;
  return tl.map((row,i)=>{
    const v = key==='brain'?row[1]:row[2];
    const x = (i/n)*300;
    const y = 40 - (v/100)*36;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
}
function togglePause(){ state.session.paused=!state.session.paused; logEvent(state.session.paused?'session_paused':'session_resumed'); render(); }
function dismissAlert(id){ const a=state.alerts.find(a=>a.id===id); a.dismissed=true; showToast('Alert dismissed'); render(); }
function openAlert(id){ state.activeAlert=id; const a=state.alerts.find(a=>a.id===id); a.read=true; go('alertExplain'); }

function screenAlertExplain(){
  const a = state.alerts.find(a=>a.id===state.activeAlert) || state.alerts[state.alerts.length-1];
  if(!a) return `<div class="topbar"><button class="back" onclick="go('live')">←</button><h2>Alert</h2></div><p class="muted">No alert selected.</p>`;
  return `
    <div class="topbar"><button class="back" onclick="go('live')">←</button><h2>Why this fired</h2></div>
    <div class="card" style="background:var(--${a.ramp}-dim); border-color:transparent; margin-bottom:14px;">
      <div class="label" style="color:inherit; opacity:.85;">${a.metricLabel}</div>
      <div style="font-size:14px; font-weight:600; margin-top:4px;">Overreaching risk detected</div>
    </div>
    <div class="label" style="margin-bottom:6px;">What we saw</div>
    <p class="muted" style="margin-top:0;">${a.why}</p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 16px;">
      <div class="metric" style="text-align:center; padding:10px 6px;"><div class="label">Brain level</div><div style="font-size:15px; font-weight:600; margin-top:4px; color:var(--brain);">${a.brain}</div></div>
      <div class="metric" style="text-align:center; padding:10px 6px;"><div class="label">Heart level</div><div style="font-size:15px; font-weight:600; margin-top:4px; color:var(--heart);">${a.heart}</div></div>
    </div>
    <div class="label" style="margin-bottom:6px;">What to do now</div>
    <div class="card" style="margin-bottom:6px;">
      ${a.recs.map(k=>{
        const r = RECOVERY_LIBRARY[k];
        const done = !!state.recoveryChecked[a.id+'_'+k];
        return `<div class="recovery-item">
          <div class="check ${done?'done':''}" onclick="toggleRecovery('${a.id}','${k}')">${done?'✓':''}</div>
          <div><div style="${done?'color:var(--text-dim); text-decoration:line-through;':''}">${r.title}</div><div class="label" style="margin-top:2px;">${r.detail}</div></div>
        </div>`;
      }).join('')}
    </div>
    <p class="muted" style="font-size:11px;">This is an inferred signal from your own baseline, not a medical diagnosis. If you feel chest pain, dizziness, or breathlessness beyond normal effort, stop training and seek medical care.</p>
    <div class="btn-row">
      <button class="btn ghost" onclick="dismissAlert('${a.id}'); go('live')">Dismiss</button>
      <button class="btn primary" onclick="go('live')">Back to session</button>
    </div>`;
}
function toggleRecovery(alertId,key){
  const k = alertId+'_'+key;
  state.recoveryChecked[k] = !state.recoveryChecked[k];
  if(state.recoveryChecked[k]) logEvent('recovery_action_logged', key);
  render();
}

function endSession(){
  stopLiveTimer();
  logEvent('session_ended', state.today.activity);
  state.session.active = false;
  const tl = TIMELINES[state.today.activity];
  const avgBrain = Math.round(tl.reduce((s,r)=>s+r[1],0)/tl.length);
  const avgHeart = Math.round(tl.reduce((s,r)=>s+r[2],0)/tl.length);
  const extra = buildCategoryExtra(state.today.activity, tl);
  state.historySessions.unshift({label:'Today', activity:state.today.activity, avgBrain, avgHeart, risk: state.alerts.length>0, extra});
  const dow = new Date().getDay(); // 0 sun .. 6 sat -> map to Mon..Sun index
  const idx = dow===0?6:dow-1;
  state.weekLog[idx] = true;
  go('summary');
}

function screenSummary(){
  const tl = TIMELINES[state.today.activity];
  const stages = tl.map(([m,b,h])=>stageFor(b,h,m));
  const counts = {warmup:0,optimal:0,effort:0,risk:0};
  stages.forEach(s=>counts[s]++);
  const total = stages.length;
  const colors = {warmup:'var(--surface-3)', optimal:'var(--teal)', effort:'var(--amber)', risk:'var(--heart)'};
  const avgBrain = Math.round(tl.reduce((s,r)=>s+r[1],0)/tl.length);
  const avgHeart = Math.round(tl.reduce((s,r)=>s+r[2],0)/tl.length);
  const doneCount = state.weekLog.filter(Boolean).length;
  const recoveryLogged = Object.values(state.recoveryChecked).filter(Boolean).length;
  const riskHappened = state.alerts.length>0;
  const catExtra = buildCategoryExtra(state.today.activity, tl);
  return `
    <div class="topbar"><h2>Session summary</h2></div>
    <div class="card" style="margin-bottom:14px;">
      <div style="font-size:15px; font-weight:600; text-transform:capitalize;">${state.today.activity.replace('bodybuilding','Bodybuilding')}</div>
      <div class="label" style="margin-top:2px;">Ended ${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} · avg brain ${avgBrain} · avg heart ${avgHeart}</div>
    </div>
    <div class="label" style="margin-bottom:6px;">Time in each stage</div>
    <div class="zonebar">${Object.keys(counts).map(k=>`<span style="width:${(counts[k]/total*100).toFixed(0)}%; background:${colors[k]};"></span>`).join('')}</div>
    <div class="zonekey" style="margin-bottom:14px;">
      ${Object.keys(STAGE_META).map(k=>`<div class="k"><div class="sw" style="background:${colors[k]};"></div>${STAGE_META[k].label}</div>`).join('')}
    </div>
    <div class="label" style="margin-bottom:6px;">This session's signature</div>
    <div class="card" style="margin-bottom:14px;">${renderCategoryChart(state.today.activity, catExtra)}</div>
    <div class="card" style="margin-bottom:14px;">
      <div class="stat-row"><span>Risk alerts</span><span>${state.alerts.length}</span></div>
      <div class="stat-row"><span>Recovery actions logged</span><span>${recoveryLogged}</span></div>
    </div>
    ${riskHappened?`<div class="banner">⚠ Overreaching was detected this session — consider an easier session or full rest next time before training ${state.today.activity} again.</div>`:`<div class="banner" style="background:var(--teal-dim); color:var(--teal);">Session stayed within your normal working range.</div>`}
    <div class="label" style="margin-bottom:6px;">This week (goal: ${state.profile.frequency}x)</div>
    <div class="card" style="margin-bottom:14px;">
      <div class="muted">${doneCount} of ${state.profile.frequency} sessions logged</div>
      <div class="weekgoal">${state.weekLog.map(d=>`<div class="d ${d?'on':''}"></div>`).join('')}</div>
    </div>
    <div class="btn-row"><button class="btn primary block" onclick="go('sessionSetup')">Start another session</button></div>`;
}

function screenHistory(){
  const filter = state.historyFilter;
  const allSessions = state.historySessions.slice(0,8);
  const sessions = filter==='all' ? allSessions : allSessions.filter(s=>s.activity===filter);
  const filterChips = [{id:'all',name:'All'}, ...ACTIVITIES];
  const latestForFilter = filter!=='all' ? sessions[0] : null;

  return `
    <div class="topbar"><h2>History</h2></div>
    <div class="chip-grid" style="grid-template-columns:repeat(3,1fr); margin-bottom:14px;">

    </div>
    ${filter==='all' ? `
      <p class="muted" style="margin-bottom:10px;">Brain and heart average per session, most recent first.</p>
      <div class="card" style="margin-bottom:16px;">
        <svg width="100%" height="120" viewBox="0 0 300 120">
          ${allSessions.map((s,i)=>{
            const gap = 300/allSessions.length; const x = i*gap + gap*0.28; const w = gap*0.2;
            const hB = (s.avgBrain/100)*100; const hH=(s.avgHeart/100)*100;
            return `<rect x="${x}" y="${110-hB}" width="${w}" height="${hB}" fill="var(--brain)" rx="2"/>
                    <rect x="${x+w+3}" y="${110-hH}" width="${w}" height="${hH}" fill="var(--heart)" rx="2"/>`;
          }).join('')}
          <line x1="0" y1="110" x2="300" y2="110" stroke="var(--border)" stroke-width="1"/>
        </svg>
        <div style="display:flex; justify-content:space-around; margin-top:4px;">
          ${allSessions.map(s=>`<span class="label">${s.label}</span>`).join('')}
        </div>
        <div class="zonekey" style="margin-top:8px;"><div class="k"><div class="sw" style="background:var(--brain);"></div>Brain</div><div class="k"><div class="sw" style="background:var(--heart);"></div>Heart</div></div>
      </div>` : `
      <p class="muted" style="margin-bottom:10px; text-transform:capitalize;">${filter} — latest session signature (${latestForFilter?latestForFilter.label:'no sessions yet'})</p>
      <div class="card" style="margin-bottom:16px;">
        ${latestForFilter ? renderCategoryChart(filter, latestForFilter.extra) : `<p class="muted">Complete a ${filter} session to see its chart here.</p>`}
      </div>`}
    <div class="label" style="margin-bottom:6px;">Sessions</div>
    ${sessions.length===0?`<p class="muted">No sessions logged yet for this filter.</p>`:sessions.map(s=>`
      <div class="row-line">
        <div><div style="font-size:13.5px; text-transform:capitalize;">${s.activity}</div><div class="label">${s.label} · brain ${s.avgBrain} · heart ${s.avgHeart}</div></div>

      </div>`).join('')}
    <p class="muted" style="margin-top:14px;">Training ${state.profile.activities.length} activity type${state.profile.activities.length===1?'':'s'} at a goal of ${state.profile.frequency}x/week. Consistent easy sessions between hard ones tend to reduce how often risk alerts fire.</p>`;
}
function setHistoryFilter(id){ state.historyFilter = id; render(); }

          <polyline points="${sparkPathFromValues(h,280,56)}" fill="none" stroke="var(--heart)" stroke-width="2"/>
        </svg>`; })()}
      <div class="zonekey" style="margin-top:4px;"><div class="k"><div class="sw" style="background:var(--brain);"></div>Brain</div><div class="k"><div class="sw" style="background:var(--heart);"></div>Heart</div></div>
    </div>
    <div class="label" style="margin:10px 0 6px;">Why it works</div>
    <div class="card" style="margin-bottom:10px; border-left:3px solid var(--brain);">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:5px;"><div class="dot brain"></div><div style="font-size:12.5px; font-weight:600; color:var(--brain);">Brain</div></div>
      <div class="muted" style="margin:0;">${ex.brainRole}</div>
    </div>
    <div class="card" style="margin-bottom:14px; border-left:3px solid var(--heart);">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:5px;"><div class="dot heart"></div><div style="font-size:12.5px; font-weight:600; color:var(--heart);">Heart</div></div>
      <div class="muted" style="margin:0;">${ex.heartRole}</div>
    </div>
    <div class="label" style="margin-bottom:6px;">When it's not working</div>
    <div class="card" style="background:var(--amber-dim); border-color:transparent; margin-bottom:14px;">
      <div style="font-size:13.5px; font-weight:600; margin-bottom:4px;">${ex.problem.title}</div>
      <div class="muted" style="margin:0; color:#e4c896;">${ex.problem.why}</div>
    </div>
    <div class="label" style="margin-bottom:6px;">How to fix it</div>
    <div class="card" style="margin-bottom:6px;">
      ${ex.solution.map(s=>`<div class="recovery-item"><div class="check" style="border-color:var(--teal);"></div><div>${s}</div></div>`).join('')}
    </div>
    <div class="btn-row"><button class="btn primary block" onclick="go('library')">Back to library</button></div>`;
}

function screenSettings(){
  const labelFor = s=>({connected:'Connected', weak:'Weak signal', disconnected:'Disconnected'}[s]);
  return `
    <div class="topbar"><h2>Settings</h2></div>
    <div class="label" style="margin-bottom:6px;">Devices</div>
    <div class="card" style="margin-bottom:16px;">
      ${state.devices.map(d=>`<div class="row-line"><div style="display:flex; align-items:center; gap:10px;"><div class="dot ${d.status==='connected'?'teal':d.status==='weak'?'amber':'heart'}"></div><div style="font-size:13px;">${d.name}</div></div><span class="label">${labelFor(d.status)}</span></div>`).join('')}
    </div>
    <div class="label" style="margin-bottom:6px;">Your activities</div>
    <div class="chip-grid" style="margin-bottom:16px;">
      ${ACTIVITIES.map(a=>`<div class="chip ${state.profile.activities.includes(a.id)?'on':''}" onclick="toggleActivity('${a.id}')">${a.name}</div>`).join('')}
    </div>
    <div class="label" style="margin-bottom:6px;">Weekly goal</div>
    <div class="chip-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:16px;">
      ${[2,3,4,5].map(n=>`<div class="chip ${state.profile.frequency===n?'on':''}" onclick="setFrequency(${n})">${n}${n===5?'+':''}x</div>`).join('')}
    </div>
    <div class="label" style="margin-bottom:6px;">Data</div>
    <div class="card"><div class="row-line"><div style="font-size:13px;">Stored on this device only</div><span class="pill teal">Private</span></div></div>`;
}

/* =========================================================================
   RENDER
========================================================================= */
const SCREENS = {
  consent: screenConsent, profile: screenProfile, deviceCheck: screenDeviceCheck,
  sessionSetup: screenSessionSetup, live: screenLive, alertExplain: screenAlertExplain,
  summary: screenSummary, history: screenHistory, library: screenLibrary,
  exerciseDetail: screenExerciseDetail, settings: screenSettings,
};
const NAV = [
  {id:'live', label:'Live', icon:'live', screen:'live'},
  {id:'library', label:'Library', icon:'library', screen:'library'},
  {id:'history', label:'History', icon:'history', screen:'history'},
  {id:'settings', label:'Settings', icon:'settings', screen:'settings'},
];
const ICONS = {
  live: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg>',
  library: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5v-17Z"/><path d="M4 19a2.5 2.5 0 0 1 2.5-2.5H20"/></svg>',
  history: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6"/></svg>',
  settings: '<svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.4 2.9a7.6 7.6 0 0 0-1.7 1l-2.3-.9-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2 1.6 2 3.4 2.3-.9c.5.4 1.1.7 1.7 1L11 21h4l.4-2.9c.6-.3 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.6z"/></svg>',
};
function render(){
  const showNav = ['live','library','history','settings'].includes(state.screen);
  const screensEl = document.getElementById('screens');
  screensEl.innerHTML = Object.keys(SCREENS).map(key =>
    `<div class="screen ${state.screen===key?'active':''}" data-screen="${key}">${SCREENS[key]()}</div>`
  ).join('');
  const navbarEl = document.getElementById('navbar');
  navbarEl.style.display = showNav ? 'flex' : 'none';
  navbarEl.innerHTML = NAV.map(n => `
    <div class="navitem ${state.screen===n.screen ? 'active':''}" onclick="go('${n.screen}')">
      ${ICONS[n.icon]}<span>${n.label}</span>
    </div>`).join('');
  if(state.screen==='live' && state.session.active) startLiveTimer(); else stopLiveTimer();
}

/* =========================================================================
   MODE SWITCH + FIGMA-STYLE FRAME BOARD
========================================================================= */
function setMode(mode){
  document.getElementById('appWrap').classList.toggle('active', mode==='app');
  document.getElementById('boardWrap').classList.toggle('active', mode==='board');
  document.getElementById('modeAppBtn').classList.toggle('active', mode==='app');
  document.getElementById('modeBoardBtn').classList.toggle('active', mode==='board');
  if(mode==='board') renderBoard();
}
const FRAME_ORDER = [
  {key:'consent', title:'Consent'},
  {key:'profile', title:'Your training'},
  {key:'deviceCheck', title:'Device check'},
  {key:'sessionSetup', title:'Start a session'},
  {key:'live', title:'Live — brain & heart'},
  {key:'alertExplain', title:'Risk & recovery'},
  {key:'summary', title:'Session summary'},
  {key:'library', title:'Workout library'},
  {key:'exerciseDetail', title:'Move detail — why & fix'},
  {key:'history', title:'History'},
  {key:'settings', title:'Settings'},
];
function renderBoard(){
  // build a temporary snapshot state so frames show meaningful demo content
  const snap = JSON.parse(JSON.stringify(state));
  snap.profile.activities = ['bodybuilding','running','yoga','hiit'];
  snap.today.activity = 'hiit';
  snap.session = {active:true, paused:false, name:'HIIT', minuteIdx:5};
  snap.alerts = [{id:'demo', ramp:'heart', metricLabel:'Brain load & heart strain', brain:88, heart:90, why:RISK_PROFILE.hiit.why, recs:RISK_PROFILE.hiit.recs, read:true, dismissed:false}];
  snap.activeAlert = 'demo';
  snap.recoveryChecked = {};
  snap.consentGiven = true;
  snap.libraryCat = 'bodybuilding';
  snap.libraryEx = 'concentration-curl';

  const oldState = JSON.stringify(state);
  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, snap);

  const canvas = document.getElementById('boardCanvas');
  canvas.innerHTML = FRAME_ORDER.map((f,i)=>`
    <div class="frame-col">
      <div class="frame">
        <div class="frame-label"><span class="fnum">${String(i+1).padStart(2,'0')}</span> ${f.title}</div>
        <div class="frame-box">
          <div class="fake-status"><span>9:41</span><span>●●● 100%</span></div>
          <div class="screen active">${SCREENS[f.key]()}</div>
        </div>
        ${i<FRAME_ORDER.length-1?'<div class="frame-arrow">→</div>':''}
      </div>
    </div>`).join('');

  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, JSON.parse(oldState));
}

render();
</script>
</body>
</html>
