<div style="display:flex; justify-content:center; padding:1rem 0; background:var(--surface-1); border-radius:12px;">
  <div style="width:280px; border:0.5px solid var(--border-strong); border-radius:28px; padding:10px; background:var(--surface-2); box-shadow:none;">

    <!-- Status bar -->
    <div style="display:flex; justify-content:space-between; align-items:center; padding:4px 10px 8px; font-size:11px; color:var(--text-muted);">
      <span>9:41</span>
      <span style="display:flex; gap:4px; align-items:center;"><i class="ti ti-wifi" style="font-size:13px;" aria-hidden="true"></i><i class="ti ti-battery-3" style="font-size:13px;" aria-hidden="true"></i></span>
    </div>

    <!-- Top bar -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:0 6px 10px;">
      <div style="font-size:14px; font-weight:500;">Live overview</div>
      <div class="node" onclick="sendPrompt('Show me the pause session state')" style="border:0.5px solid var(--border-strong); border-radius:var(--radius); padding:4px 8px; font-size:11px; cursor:pointer;">Pause</div>
    </div>

    <!-- Device status -->
    <div style="display:flex; align-items:center; gap:6px; padding:6px 6px; font-size:11px; color:var(--text-secondary);">
      <i class="ti ti-antenna" style="font-size:14px; color:var(--text-success);" aria-hidden="true"></i>
      3 devices connected
    </div>

    <!-- Metric cards -->
    <div id="metrics" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:4px 6px 10px;"></div>

    <!-- Signal chart -->
    <div class="node" onclick="sendPrompt('Show me the Player detail screen')" style="margin:0 6px 10px; background:var(--surface-1); border-radius:var(--radius); padding:10px; cursor:pointer;">
      <div style="font-size:11px; color:var(--text-secondary); margin-bottom:6px;">Live feed · tap for detail</div>
      <svg width="100%" height="40" viewBox="0 0 240 40"><polyline points="0,30 20,22 40,26 60,14 80,20 100,10 120,18 140,8 160,16 180,6 200,14 220,10 240,18" fill="none" stroke="var(--text-accent)" stroke-width="1.5"/></svg>
    </div>

    <!-- Alerts -->
    <div style="padding:0 6px 6px; font-size:11px; color:var(--text-secondary);">Alerts</div>
    <div id="alerts" style="display:flex; flex-direction:column; gap:6px; padding:0 6px 10px;"></div>

    <div class="node" onclick="sendPrompt('Show me the Alert explanation screen')" style="margin:0 6px 8px; text-align:center; font-size:12px; color:var(--text-accent); cursor:pointer;">View all insights</div>

    <!-- Bottom nav -->
    <div style="display:flex; justify-content:space-around; border-top:0.5px solid var(--border); padding-top:8px; margin-top:4px;">
      <i class="ti ti-activity" style="font-size:18px; color:var(--text-accent);" aria-hidden="true"></i>
      <i class="ti ti-users" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i>
      <i class="ti ti-bell" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i>
      <i class="ti ti-settings" style="font-size:18px; color:var(--text-muted);" aria-hidden="true"></i>
    </div>
  </div>
</div>

<script>
const metrics = [
  {label:'Readiness', value:'82%'},
  {label:'Focus', value:'71%'},
  {label:'Pressure', value:'44%'},
  {label:'Recovery', value:'90%'}
];
const mEl = document.getElementById('metrics');
metrics.forEach(m=>{
  const d = document.createElement('div');
  d.style.cssText = 'background:var(--surface-1); border-radius:var(--radius); padding:8px;';
  d.innerHTML = `<div style="font-size:10px; color:var(--text-secondary);">${m.label}</div><div style="font-size:16px; font-weight:500; margin-top:2px;">${m.value}</div><div style="font-size:9px; color:var(--text-muted); margin-top:2px;">vs. baseline</div>`;
  mEl.appendChild(d);
});

const alerts = [
  {ramp:'amber', text:'Rising pressure, suggest a breathing cue'},
  {ramp:'blue', text:'Focus trending above baseline'}
];
const aEl = document.getElementById('alerts');
alerts.forEach(a=>{
  const bg = a.ramp==='amber' ? 'var(--bg-warning)' : 'var(--bg-accent)';
  const fg = a.ramp==='amber' ? 'var(--text-warning)' : 'var(--text-accent)';
  const d = document.createElement('div');
  d.className = 'node';
  d.style.cssText = `background:${bg}; border-radius:var(--radius); padding:8px 10px; font-size:11px; color:${fg}; cursor:pointer; display:flex; justify-content:space-between; gap:6px;`;
  d.onclick = ()=> sendPrompt('Show me the Alert explanation screen');
  d.innerHTML = `<span>${a.text}</span><i class="ti ti-x" style="font-size:13px;" aria-hidden="true"></i>`;
  aEl.appendChild(d);
});
</script>
